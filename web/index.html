// Подсказка сайта, как в приложении: «Получите 6×5 или 20×4, чтобы повысить балл до четверки», «покорим новые вершины», «мало оценок»
function adviceOf(rs) {
  const h = rs?.hint || [];
  if (!h.length) return null;
  const text = h.map((x) => (typeof x === "string" ? x : `${x[1]}×${x[0]}`)).join("");
  const marksIn = h.filter(Array.isArray);
  const goal = ({ пятерки: 5, четверки: 4, тройки: 3 })[(/до (пятерки|четверки|тройки)/.exec(text) || [])[1]] || "";
  if (marksIn.length) return { kind: "up", text, goal, short: marksIn.map(([v, n]) => `${n} <span class="mark xs ${cls(v)}">${v}</span>`).join(" или ") + (goal ? ` до ${goal}` : "") };
  if (/мало оценок/.test(text)) return { kind: "few", text, short: "По предмету мало оценок!" };
  return { kind: "ok", text };
}
function adviceHtml(rs) {
  return (rs?.hint || []).map((x) => (typeof x === "string" ? esc(x) : `${x[1]} x <span class="mark sm ${cls(x[0])}">${x[0]}</span>`)).join("");
}
const subjectMarks = (name) => allMarks().filter((m) => m.subject === name);
const chipOf = (m) => `<span class="mark sm tap ${cls(m.value.split("/")[0])}" role="button" tabindex="0" data-mark="${esc(m.key)}" aria-label="Оценка ${esc(m.value)}, ${esc(m.subject)}: подробности">${esc(m.value)}</span>`;
function chipsRow(list, limit = 10) {
  let lead = 0;
  while (lead < list.length && list[lead].value === "5") lead++;
  const chips = list.slice(0, limit).map(chipOf);
  if (lead >= 3) { const n = Math.min(lead, chips.length); chips.splice(0, n, `<span class="streak">${chips.slice(0, n).join("")}<em>подряд!</em></span>`); }
  if (list.length > limit) chips.push(`<span class="mark sm dots" aria-hidden="true">…</span>`);
  return `<div class="chips" data-mctx="subject:${esc(list[0]?.subject || "")}">${chips.join("")}</div>`;
}
const localAvg = (list) => { const n = numMarks(list); return n.length ? mean(n).toFixed(2).replace(".", ",") : ""; };
function subjectCard(name, list) {
  const rs = ratingFor(name), s = subj(name), avg = rs?.mark || localAvg(list), adv = adviceOf(rs);
  const tile = adv && adv.kind !== "ok";
  const chg = rs?.change ? `<span class="achg ${downChange(rs.change) ? "neg" : "pos"}">${downChange(rs.change) ? "↓" : "↑"} ${esc(rs.change.replace(/^[+-]/, ""))}</span>` : "";
  const right = tile
    ? `<div class="atile ${mood(rs.mood)}">${chg}<strong>${esc(avg)}</strong><small>Ср. балл</small><div class="aadv">${adv.short}</div><div class="alab">можно повысить</div></div>`
    : `<div class="avg2"><strong>${esc(avg)}</strong><small>Ср. балл</small></div>`;
  const bar = rs && (rs.classPlace || rs.place) ? `<div class="sbar">${rs.classPlace ? `<span class="dia sm">${rs.classPlace}</span><span class="sl">рейтинг<br>в классе</span>` : ""}${rs.place ? `<span class="dia sm s">${rs.place}</span><span class="sl">рейтинг<br>в параллели</span>` : ""}</div>` : "";
  return `<div class="scard ${mood(rs?.mood)} tap" role="button" tabindex="0" data-open-subject="${esc(name)}" aria-label="${esc(name)}: подробности"><i class="wm" aria-hidden="true">${s.icon}</i>
    <div class="sc-main"><div class="sc-left"><div class="sc-name">${esc(name)}</div>${chipsRow(list)}</div>${right}</div>${bar}</div>`;
}
function ratingPlaques(withPast = true) {
  const r = ratingData();
  if (!r || !(r.class?.place || r.parallel?.place)) return "";
  const one = (x, kind, label, key) => (x?.place ? `<button class="plq" data-open-rating><span class="${kind}">${x.place}</span><b>Рейтинг<br>${label}${withPast ? pastLine(x.place, (e) => e[key]) : ""}</b></button>` : "");
  return `<div class="plaques">${one(r.class, "dia", "в классе", "c")}${one(r.parallel, "dia s", "в параллели", "p")}</div>`;
}

// Окно предмета: соседи в рейтинге, средний балл с подсказкой сайта и все оценки по предмету
function subjectScreen(sc) {
  const name = sc.name, rs = ratingFor(name), list = subjectMarks(name), classes = ratingData()?.classes || [];
  const board = rs?.board || [], me = myRow(board);
  const avg = rs?.mark || localAvg(list), chg = rs?.change;
  let h = scrTop(name, ratingData()?.period || "");
  if (me && board.length) {
    const past = pastPoints((e) => e.s?.[name]?.[1]);
    h += `<div class="scr-card light"><div class="scr-card-h"><b>В параллели</b><b class="r">В классе</b></div>${boardRows(around(board), "all", me[R_C], classes, board)}
      ${past.length ? `<div class="note-calc">Раньше в параллели: ${past.map((p) => `${shortDate(p.d)} — ${p.v}`).join(", ")}</div>` : ""}
      <button class="lnk center" data-open-board="${esc(name)}" data-bmode="all">Открыть все ›</button></div>`;
  }
  const adv = rs?.hint ? adviceHtml(rs) : "";
  h += `<div class="scr-card light"><div class="sj-avg"><div class="atile ${mood(rs?.mood)}">${chg ? `<span class="achg ${downChange(chg) ? "neg" : "pos"}">${downChange(chg) ? "↓" : "↑"} ${esc(chg.replace(/^[+-]/, ""))}</span>` : ""}<strong>${esc(avg)}</strong><small>ср. балл<br>общий</small></div>
    <div class="sj-adv">${adv || (list.length ? "" : "Оценок по предмету пока нет.")}</div></div>
    <div class="chips" data-mctx="subject:${esc(name)}">${list.map(chipOf).join("")}</div></div>
    ${rs?.board?.length ? `<button class="share" data-open-cls="${esc(name)}" style="margin-top:12px">Места классов по предмету</button>` : ""}
    <button class="share" data-share>Поделиться</button>`;
  return { html: h, theme: `subj ${mood(rs?.mood)}` };
}
function shareText(name) {
  const rs = ratingFor(name), list = subjectMarks(name);
  const bits = [`${name}: средний балл ${rs?.mark || localAvg(list) || "—"}`];
  if (rs?.classPlace) bits.push(`место в классе ${rs.classPlace}`);
  if (rs?.place) bits.push(`в параллели ${rs.place}`);
  return bits.join(", ") + `. Оценки: ${list.map((m) => m.value).join(" ")}`;
}
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}
async function copyText(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch { toast("Не получилось скопировать"); }
}
async function shareScreen() {
  const sc = screens[screens.length - 1]; if (!sc || sc.t !== "subject") return;
  const text = shareText(sc.name);
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  copyText(text, "Скопировано, можно вставить в сообщение");
}

// Страница урока («Описание урока»): дата и время, тема, отметки, домашнее задание, учитель
function lessonScreen(sc) {
  const [date, li] = String(sc.key).split("|"), day = data.days.find((d) => d.date === date), l = day?.lessons[Number(li)];
  if (!l) return { html: scrTop("Урок") + `<div class="scr-note">Урок не найден.</div>`, theme: "light" };
  const dt = parse(date), done = store.get("done", {}), dk = `${date}|${l.subject}|${l.n}`, isDone = !!done[dk];
  const teachers = teachersOf(l.subject).map((t) => t.name).filter(Boolean);
  const hw = !noHw(l.homework) ? l.homework : "";
  return { theme: "light", html: scrTop(l.subject) + `<div class="ls-head"><small>${dt.getDate()} ${MONTHS[dt.getMonth()].toUpperCase()}, ${(WD[day.weekday] || "").toUpperCase()}<br>${esc(l.start)}–${esc(l.end)}</small>
      <div class="ls-n">${esc(l.n)} УРОК</div><h2>${esc(l.subject)}</h2><div class="ls-theme">${esc(l.theme || "Тема урока пока не указана")}</div></div>
    ${l.marks.length ? `<h3 class="ls-h">Отметки</h3><div class="ls-box">${l.marks.map((m, mi) => `<div class="ls-mark">${tapMark(date, Number(li), mi, m, l.subject)}<span>${esc(m.work || "")}</span></div>`).join("")}</div>` : ""}
    ${hw || (l.files || []).length ? `<h3 class="ls-h">Домашнее задание к уроку</h3><div class="ls-box"><div class="ls-hw ${isDone ? "done" : ""}"><span>${esc(hw)}</span>
      <button class="check ${isDone ? "on" : ""}" data-lesson-done="${esc(dk)}" aria-label="Сделано">✓</button></div>${fileChips(l)}
      ${hw ? `<button class="lnk center" data-copy-hw="${esc(`${date}|${li}`)}">Скопировать текст задания</button>` : ""}</div>` : ""}
    ${teachers.length ? `<h3 class="ls-h">Урок проводит</h3><div class="ls-box">${teachers.map((t) => `<div class="ls-t"><i>${esc(t.split(" ").map((x) => x[0]).join("").slice(0, 2).toUpperCase())}</i>${esc(t)}</div>`).join("")}</div>` : ""}` };
}

// ---------- Главная («Домашка»): лента последних оценок ----------
const WORK_ABBR = [[/^ответ/i, "ОТВ"], [/диктант/i, "ДИ"], [/практическ/i, "П/Р"], [/самостоятельн/i, "С/Р"], [/контрольн/i, "К/Р"], [/тест/i, "ТЕСТ"], [/зач[её]т/i, "ЗАЧ"], [/проект/i, "ПРОЕКТ"], [/домашн/i, "Д/Р"]];
function workAbbr(w) {
  const hit = WORK_ABBR.find(([re]) => re.test(w || ""));
  if (hit) return hit[1];
  const t = String(w || "").trim();
  return t ? t.split(/\s+/).map((x) => x[0]).join("").toUpperCase().slice(0, 3) : "ОЦЕНКА";
}
function recentStrip() {
  const marks = allMarks().slice(0, 12);
  if (!marks.length) return "";
  return `<h2 class="strip-h">Последние оценки</h2><div class="rstrip" data-mctx="recent">${marks.map((m) => `<div class="rtile2 tap" role="button" tabindex="0" data-mark="${esc(m.key)}" aria-label="Оценка ${esc(m.value)}, ${esc(m.subject)}: подробности">
    <span class="mark ${cls(m.value.split("/")[0])}">${esc(m.value)}</span><b>${esc(m.subject)}</b><small>${esc(workAbbr(m.work))}, за ${esc(shortDate(m.date))}</small></div>`).join("")}</div>`;
}

// ---------- Карточка оценки: как в приложении (когда выставлена, как справился класс, места по предмету, переход на урок и к оценкам по предмету) ----------
let markKey = null, markList = [];
const numMarks = (list) => list.map((m) => Number(String(m.value).trim().split("/")[0])).filter((x) => x >= 1 && x <= 5);
const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
function setMarkContext(el) {
  const c = el?.closest?.("[data-mctx]")?.dataset.mctx || "";
  const all = allMarks();
  markList = (c === "recent" ? all.slice(0, 12) : c.startsWith("subject:") ? all.filter((m) => m.subject === c.slice(8)) : []).map((m) => m.key);
}
function markDetails(key) {
  const [date, li, mi] = String(key).split("|");
  const lesson = data?.days.find((d) => d.date === date)?.lessons[Number(li)], mark = lesson?.marks[Number(mi)];
  if (!mark) return null;
  const subject = lesson.subject, mine = String(mark.value ?? "").trim(), when = mark.created || date;
  const info = (mark.id && data.markInfo?.[mark.id]) || null, rs = ratingFor(subject);
  const same = allMarks().filter((m) => m.subject === subject);
  const avg = mean(numMarks(same)), before = mean(numMarks(same.filter((m) => m.created < when)));
  const y = (data.years || []).find((x) => x.current);                       // средний балл за период берём тот же, что показывает сайт, если он есть
  const term = y && (y.terms || []).find((t) => t.start && t.finish && date >= t.start && date <= t.finish);
  const official = String((term?.subjects || []).find((x) => x.name === subject)?.average || "");
  const value = info?.avg || official || (avg != null ? avg.toFixed(2).replace(".", ",") : "");
  const mine1 = Number(mine.split("/")[0]);
  let trend = before != null && mine1 >= 1 && mine1 <= 5 ? (mine1 > before ? "↑" : mine1 < before ? "↓" : "") : "";   // стрелка: оценка подняла или опустила средний балл
  if (info?.tr) trend = info.tr === "up" ? "↑" : info.tr === "down" ? "↓" : "";
  return { key, date, subject, mine, work: mark.work || "Оценка", value, num: Number(value.replace(",", ".")), trend, official: !!(info?.avg || official), mood: info?.mood || rs?.mood || "",
    posted: `Выставлено ${shortDate(when)} за урок ${shortDate(date)}`, classmates: info?.cm || [], pc: info?.pc ?? rs?.classPlace ?? 0, pp: info?.pp ?? rs?.place ?? 0,
    theme: (lesson.theme || "").replace(/\s+/g, " ").trim(), teachers: teachersOf(subject).map((t) => t.name).filter(Boolean), icon: subj(subject).icon };
}
let markAnim = "";
function openMark(key, el) {                        // открыть карточку оценки; «назад» на телефоне её закроет
  if (el) setMarkContext(el);
  const was = !!markKey;
  markKey = key; markAnim = "";
  if (!was) { try { history.pushState({ ...(history.state || {}), m: 1 }, ""); } catch {} }
  showMarkModal();
}
function closeMark() {
  if (!markKey) return;
  if (history.state?.m) { try { history.back(); return; } catch {} }
  markKey = null; showMarkModal();
}
function showMarkModal() {                         // только окно: страница под ним не перерисовывается (раскрытые уроки и прокрутка остаются)
  $("#modal").innerHTML = confirmModal() || markModal();
  if (markKey) { const x = document.querySelector("#modal .mm-x"); if (x) x.focus({ preventScroll: true }); }
}
function markStep(delta) {
  const i = markList.indexOf(markKey), next = markList[i + delta];
  if (i < 0 || !next) return;
  markKey = next; markAnim = delta > 0 ? "slide-l" : "slide-r"; showMarkModal(); markAnim = "";
}
const MARK_VAR = { 5: "--m5", 4: "--m4", 3: "--m3", 2: "--m2", 1: "--m1", "ЗЧ": "--m5", "ЗАЧ": "--m5" };
function donut(mine, cm) {                          // кольцо: доли оценок класса за эту работу, в середине — своя оценка
  const total = cm.reduce((s, x) => s + x[1], 0), C = 2 * Math.PI * 50;
  let off = 0;
  const segs = total ? cm.map(([v, n]) => {
    const len = (n / total) * C, gap = cm.length > 1 ? 3 : 0;
    const s = `<circle r="50" cx="60" cy="60" style="stroke:var(${MARK_VAR[String(v).toUpperCase()] || "--mx"})" stroke-dasharray="${Math.max(0, len - gap).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;
    off += len; return s;
  }).join("") : "";
  const first = mine.split("/")[0];
  return `<div class="donut"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" r="50" cx="60" cy="60"/>${segs}</svg><span class="mid ${cls(first)}">${esc(mine)}</span></div>`;
}
function markModal() {
  const d = markKey && data ? markDetails(markKey) : null;
  if (!d) return "";
  const avgCls = d.mood ? ({ Good: "m5", Average: "m3", Bad: "m1" })[d.mood] : (d.value && d.num ? cls(Math.round(d.num)) : "");
  const i = markList.indexOf(d.key), nav = markList.length > 1 && i >= 0;
  const total = d.classmates.reduce((s, x) => s + x[1], 0);
  const cm = d.classmates.map(([v, n, md]) => `<div class="cmrow"><span class="mark xs ${cls(v) || ({ Good: "m5", Average: "m3", Bad: "m1" })[md] || ""}">${esc(v)}</span><span>${n} ${plural(n, ["ученик", "ученика", "учеников"])}</span>${total ? `<span class="pc">${Math.round((n / total) * 100)}%</span>` : ""}</div>`).join("");
  const plaques = d.pc || d.pp ? `<div class="plaques in-modal">${d.pc ? `<button class="plq" data-open-board="${esc(d.subject)}" data-bmode="class"><span class="dia">${d.pc}</span><b>Рейтинг<br>в классе ›</b></button>` : ""}${d.pp ? `<button class="plq" data-open-board="${esc(d.subject)}" data-bmode="all"><span class="dia s">${d.pp}</span><b>Рейтинг<br>в параллели ›</b></button>` : ""}</div>` : "";
  const first = d.mine.split("/")[0];
  const mine = cm ? donut(d.mine, d.classmates) : `<span class="mm-big ${cls(first)}">${esc(d.mine)}</span>`;
  return `<div class="modal-back sheet ${markAnim ? "nofade" : ""}" data-modal-back><div class="modal markmodal ${markAnim}" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mm-hero ${cls(first) || "m0"}"><div class="mm-when">📅 ${esc(d.posted)}</div><div class="mm-hrow"><div><h3 id="mtitle">${esc(d.subject)}</h3><div class="mm-sub">${esc(d.work)}</div></div>
      <span class="mm-ic" aria-hidden="true">${d.icon}</span></div>
      <button class="mm-x" data-mark-close aria-label="Закрыть">✕</button></div>
    ${d.teachers.length ? `<div class="mm-line"><span class="k">Учитель:</span> ${esc(d.teachers.join(", "))}</div>` : ""}
    ${d.theme ? `<div class="mm-line"><span class="k">Тема урока:</span> <span class="mm-theme">${esc(d.theme)}</span></div>` : ""}
    <div class="mm-box ${cm ? "" : "one"}"><div><b>Ваша оценка</b>${mine}
        <div class="mm-note">ср. балл</div>${d.value ? `<span class="mm-avg ${avgCls}">${esc(d.value)}${d.trend ? `<span aria-label="${d.trend === "↑" ? "оценка подняла средний балл" : "оценка опустила средний балл"}">${d.trend}</span>` : ""}</span>` : `<div class="mm-note">пока нет</div>`}</div>
      ${cm ? `<div><b>Одноклассники</b>${cm}</div>` : ""}</div>
    ${plaques}
    <div class="mbtns"><button class="safe" data-open-lesson="${esc(d.key)}">Описание урока</button><button class="alt" data-open-subject="${esc(d.subject)}">Все оценки по предмету</button></div>
    ${nav ? `<div class="mm-nav"><button data-mark-nav="-1" ${i === 0 ? "disabled" : ""} aria-label="Новее">‹</button><span>${i + 1} из ${markList.length}</span><button data-mark-nav="1" ${i === markList.length - 1 ? "disabled" : ""} aria-label="Старше">›</button></div>` : ""}
  </div></div>`;
}

// ---------- Оценки ----------
let marksView = "now", yearIdx = 0, termSel = {};
const seg = (items, cur, attr, cls2 = "") => `<div class="seg ${cls2}">${items.map(([k, label]) => `<button class="${String(k) === String(cur) ? "on" : ""}" ${attr}="${esc(k)}">${esc(label)}</button>`).join("")}</div>`;

function markChip(v, small = true) {
  const t = String(v ?? "").trim();
  if (!t) return `<span class="dash">–</span>`;
  const first = t.split("/")[0];
  return `<span class="mark ${small ? "sm" : ""} ${cls(first)}">${esc(t)}</span>`;
}

// ---------- Посещаемость ----------
const plural = (n, f) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? f[2] : d > 1 && d < 5 ? f[1] : d === 1 ? f[0] : f[2]; };
const lessonsWord = (n) => `${n} ${plural(n, ["урок", "урока", "уроков"])}`;
const daysWord = (n) => `${n} ${plural(n, ["день", "дня", "дней"])}`;
// Сколько разных дней с пропусками (опоздания не считаем: на урок ученик всё же пришёл)
function missedDays(days) { return new Set((days || []).filter((d) => d.kind !== "late").map((d) => d.date)).size; }
const lessonsAndDays = (lessons, days) => (days ? `${lessonsWord(lessons)} <span style="white-space:nowrap">(${daysWord(days)})</span>` : lessonsWord(lessons));
const WDAY = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const ATT_ICON = { ill: "🤒", absent: "❗", late: "⏰" };
function lessonRanges(list) {
  const a = [...list].sort((x, y) => x - y), out = [];
  for (let i = 0; i < a.length; ) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}–${a[j]}` : `${a[i]}`); i = j + 1; }
  return out.join(", ");
}
const daysGen = (n) => (n % 10 === 1 && n % 100 !== 11 ? "дня" : "дней");     // «из 41 дня», «из 42 дней»
// Сколько учебных дней было в периоде и в скольких из них ученик был в школе. Учебные дни берём из расписания (только для идущего года:
// за прошлые годы сайт расписание не отдаёт). День считается пропущенным целиком, если пропущены все его уроки; неполные дни считаем отдельно.
function schoolDayStats(t, y) {
  if (!y?.current || !t?.attendance) return null;
  const range = termRange(t);
  if (!range) return null;
  const today = todayIso(), last = range[1] < today ? range[1] : today, gone = {};
  for (const e of t.attendance.days || []) {
    if (e.kind === "late") continue;
    const set = (gone[e.date] ??= new Set());
    const nums = (e.lessons || []).length ? e.lessons : (e.items || []).map((i) => i.n);
    if (nums.length) nums.forEach((n) => set.add(Number(n))); else set.add("all");
  }
  let total = 0, full = 0, partial = 0;
  for (const [date, lessons] of schoolDayMap()) {
    if (date < range[0] || date > last) continue;
    total++;
    const set = gone[date];
    if (!set) continue;
    if (set.has("all") || lessons.every((l) => set.has(Number(l.n)))) full++; else partial++;
  }
  return total ? { total, attended: total - full, partial } : null;
}
const schoolDaysLine = (s) => (s ? `<br>Дней в школе: ${s.attended} из ${s.total}&nbsp;${daysGen(s.total)}${s.partial ? ` <span class="att-sub">(из них неполных: ${s.partial})</span>` : ""}` : "");
function attendanceCard(a, title = "Посещаемость", withDays = true, stats = null) {
  if (!a) return "";
  const absent = Number(a.absent) || 0, ill = Number(a.ill) || 0, late = Number(a.late) || 0, other = absent - ill;
  const parts = [];
  if (ill) parts.push(`${lessonsWord(ill)} по болезни`);
  if (other > 0) parts.push(`${lessonsWord(other)} по другим причинам`);
  const text = !absent && !late
    ? `<b>🎉 Пропусков и опозданий нет</b><br>Всего уроков: ${Number(a.total) || 0}${schoolDaysLine(stats)}`
    : `<b>Пропущено ${lessonsAndDays(absent, missedDays(a.days))}</b>${parts.length ? `<br>${parts.join(", ")}` : ""}${late ? `<br>Опозданий: ${late}` : ""}<br>Всего уроков: ${Number(a.total) || 0}${schoolDaysLine(stats)}`;
  const days = withDays && (a.days || []).length ? `<details><summary>Показать дни (${a.days.length})</summary>${a.days.map((d) => {
    const dt = parse(d.date);
    return `<div class="att-day"><span>${ATT_ICON[d.kind] || "•"}</span><b>${dt.getDate()} ${MONTHS[dt.getMonth()]}, ${WDAY[dt.getDay()]}</b>
      <span>${esc(d.name)}${(d.lessons || []).length ? `, ${(d.lessons || []).length > 1 ? "уроки" : "урок"} ${esc(lessonRanges(d.lessons))}` : ""}</span></div>`; }).join("")}</details>` : "";
  return `<div class="card att ${absent || late ? "warn" : ""}"><div class="att-title">${esc(title)}</div>
    <div class="att-head"><div class="att-pct"><strong>${Number(a.percent) || 0}%</strong><span>на уроках</span></div><div class="att-text">${text}</div></div>${days}</div>`;
}
function attendanceYear(y) {
  const rows = (y.terms || []).filter((t) => t.attendance);
  if (!rows.length) return "";
  const total = rows.reduce((s, t) => s + (Number(t.attendance.total) || 0), 0), absent = rows.reduce((s, t) => s + (Number(t.attendance.absent) || 0), 0);
  const pct = total ? Math.round((100 * (total - absent)) / total) : 100;
  const lab = y.periodLabel === "тр" ? "тр" : "пер.";
  const all = rows.map((t) => schoolDayStats(t, y)).filter(Boolean);
  const yearStats = all.length ? { total: all.reduce((s, x) => s + x.total, 0), attended: all.reduce((s, x) => s + x.attended, 0), partial: all.reduce((s, x) => s + x.partial, 0) } : null;
  return `<div class="card att ${absent ? "warn" : ""}" style="margin-top:12px"><div class="att-title">Посещаемость за год</div>
    <div class="att-head"><div class="att-pct"><strong>${pct}%</strong><span>на уроках</span></div>
    <div class="att-text"><b>${absent ? `Пропущено ${lessonsAndDays(absent, missedDays(rows.flatMap((t) => t.attendance.days || [])))}` : "🎉 Пропусков нет"}</b><br>Всего уроков: ${total}${schoolDaysLine(yearStats)}</div></div>
    <div class="att-terms">${rows.map((t) => `<div><span>${esc(t.number)} ${lab}</span><span>${t.attendance.absent ? `пропущено ${lessonsAndDays(Number(t.attendance.absent) || 0, missedDays(t.attendance.days))}` : "без пропусков"} · ${Number(t.attendance.percent) || 0}%</span></div>`).join("")}</div></div>`;
}
function currentAttendanceCard() {
  const y = (data.years || []).find((x) => x.current);
  const t = y && [...(y.terms || [])].reverse().find((x) => x.attendance);
  return t ? attendanceCard(t.attendance, `Посещаемость (${t.number} ${y.periodLabel === "тр" ? "тр" : "пер."})`, true, schoolDayStats(t, y)) : "";
}

// ---------- Экран «Посещаемость»: календарь по дням ----------
const MONTHS_FULL = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONTHS_GEN = MONTHS;
const WD_FULL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
let attDay = null, attTerm = {};

function schoolDayMap() { const m = new Map(); for (const d of data.days) { const ls = d.lessons.filter((l) => !l.canceled); if (ls.length) m.set(d.date, ls); } return m; }
function termRange(t) {
  const ds = (t.attendance?.days || []).map((d) => d.date).sort();
  const start = t.start || ds[0], finish = t.finish || ds[ds.length - 1];
  return start && finish ? [start, finish] : null;
}

function calendarHtml(t, y) {
  const range = termRange(t);
  if (!range) return "";
  const [start, finish] = range, today = todayIso();
  const byDay = {};
  for (const d of t.attendance.days) (byDay[d.date] ??= []).push(d);
  const school = y.current ? schoolDayMap() : null;
  let cur = parse(start); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const end = parse(finish);
  let out = "";
  while (cur <= end) {
    const yr = cur.getFullYear(), mo = cur.getMonth(), n = new Date(yr, mo + 1, 0).getDate();
    const lead = (new Date(yr, mo, 1).getDay() + 6) % 7;                   // неделя начинается с понедельника
    let cells = "";
    for (let i = 0; i < lead; i++) cells += `<span class="cal-cell blank"></span>`;
    for (let d = 1; d <= n; d++) {
      const dt = new Date(yr, mo, d), date = iso(dt), wd = dt.getDay(), ents = byDay[date];
      if (date < start || date > finish) { cells += `<span class="cal-cell blank"></span>`; continue; }
      let kind;
      if (ents) kind = ents.some((e) => e.kind === "absent") ? "absent" : ents.some((e) => e.kind === "ill") ? "ill" : "late";
      else if (school) kind = school.has(date) ? (date <= today ? "ok" : "future") : "none";
      else kind = wd === 0 || wd === 6 ? "none" : "ok";   // за прошлые годы расписания нет: будни без пропусков считаем днями на уроках
      const cl = `cal-cell ${kind} ${date === today ? "today" : ""} ${date === attDay ? "sel" : ""}`;
      cells += kind === "none" ? `<span class="${cl}">${d}</span>` : `<button class="${cl}" data-aday="${date}" aria-label="${d} ${MONTHS_GEN[mo]}">${d}</button>`;
    }
    out += `<div class="cal-month"><div class="cal-title">${MONTHS_FULL[mo]} ${yr}</div><div class="cal-grid">
      ${["пн", "вт", "ср", "чт", "пт", "сб", "вс"].map((w) => `<span class="cal-wd">${w}</span>`).join("")}${cells}</div></div>`;
    cur = new Date(yr, mo + 1, 1);
  }
  return out;
}

function dayInfoHtml(t, y) {
  if (!attDay) return `<div class="att-hint">Нажмите на день в календаре, чтобы увидеть подробности.</div>`;
  const dt = parse(attDay), title = `${dt.getDate()} ${MONTHS_GEN[dt.getMonth()]}, ${WD_FULL[dt.getDay()]}`;
  const ents = (t.attendance?.days || []).filter((d) => d.date === attDay);
  let body;
  if (ents.length) {
    body = ents.map((e) => {
      const items = e.items?.length ? e.items.map((i) => `<div>${esc(i.n)} урок: ${esc(i.subject)}</div>`).join("")
        : e.lessons?.length ? `<div>${e.lessons.length > 1 ? "уроки" : "урок"} ${esc(lessonRanges(e.lessons))}</div>` : "";
      return `<div class="dp-row"><span>${ATT_ICON[e.kind] || "•"}</span><div><b>${esc(e.name)}</b><div class="dp-items">${items}</div></div></div>`;
    }).join("");
  } else if (y.current) {
    const ls = schoolDayMap().get(attDay);
    body = ls ? `<div class="dp-row"><span>${attDay <= todayIso() ? "✅" : "🗓"}</span><div><b>${attDay <= todayIso() ? "Был на всех уроках" : "Уроки ещё впереди"}</b>
      <div class="dp-items">${ls.map((l) => `<div>${esc(l.n)} урок: ${esc(l.subject)}</div>`).join("")}</div></div></div>`
      : `<div class="dp-row"><span>🏠</span><div><b>Выходной день или уроков не было</b></div></div>`;
  } else {
    body = `<div class="dp-row"><span>✅</span><div><b>Был на уроках</b></div></div>`;
  }
  return `<div class="card dayinfo"><h3>${esc(title)}</h3>${body}</div>`;
}

function attDaysList(t) {
  const days = t.attendance?.days || [];
  if (!days.length) return "";
  return `<h2>Дни с пропусками</h2><div class="card att-list">${days.map((d) => {
    const dt = parse(d.date), subjects = [...new Set((d.items || []).map((i) => i.subject))];
    return `<div class="att-day"><span>${ATT_ICON[d.kind] || "•"}</span><b>${dt.getDate()} ${MONTHS[dt.getMonth()]}, ${WDAY[dt.getDay()]}</b>
      <span><b>${esc(d.name)}${d.lessons?.length ? `, ${d.lessons.length > 1 ? "уроки" : "урок"} ${esc(lessonRanges(d.lessons))}` : ""}</b>${subjects.length ? esc(subjects.join(", ")) : ""}</span></div>`;
  }).join("")}</div>`;
}

function yearNavHtml(years, y) {
  return `<div class="nav yearnav"><button data-year="1" ${yearIdx >= years.length - 1 ? "disabled" : ""} aria-label="Прошлый год">‹</button>
    <div class="ttl">${esc(y.label)} (${esc(y.className)})<small>${y.current ? "этот учебный год" : "прошлый учебный год"}</small></div>
    <button data-year="-1" ${yearIdx <= 0 ? "disabled" : ""} aria-label="Следующий год">›</button></div>`;
}

function viewAttendance() {
  const years = data.years || [];
  if (!years.length) return `<div class="empty">${emptyArt("calendar")}Данные о посещаемости появятся после следующего обновления.</div>`;
  yearIdx = Math.max(0, Math.min(years.length - 1, yearIdx));
  const y = years[yearIdx], terms = y.terms.filter((t) => t.attendance);
  let out = yearNavHtml(years, y);
  if (!terms.length) return out + `<div class="empty">${emptyArt("sprout")}За этот год данных о посещаемости нет.</div>`;
  let sel = attTerm[y.label];
  if (!sel || !terms.some((t) => String(t.number) === sel)) sel = String(terms[terms.length - 1].number);
  attTerm[y.label] = sel;
  const t = terms.find((x) => String(x.number) === sel), lab = y.periodLabel === "тр" ? "тр" : "пер.";
  out += seg(terms.map((x) => [String(x.number), `${x.number} ${lab}`]), sel, "data-aterm", "small");
  out += `<div style="margin-top:12px">${attendanceCard(t.attendance, "Посещаемость", false, schoolDayStats(t, y))}</div>`;
  out += `<div class="legend"><span><i class="l-ok"></i>был на уроках</span><span><i class="l-ill"></i>болезнь</span>
    <span><i class="l-absent"></i>пропуск</span><span><i class="l-late"></i>опоздание</span><span><i class="l-none"></i>нет уроков</span></div>`;
  out += calendarHtml(t, y) + dayInfoHtml(t, y) + attDaysList(t);
  if (!y.current) out += `<div class="term-sub" style="margin-top:12px">За прошлые годы сайт не сообщает, какие дни были учебными, поэтому зелёным отмечены все будни без пропусков (в праздники и каникулы это могло быть не так), а выходные бледными цифрами.</div>`;
  return out;
}

function viewYears() {
  const years = data.years || [];
  if (!years.length) return `<div class="empty">${emptyArt("book")}Итоговые оценки появятся после следующего обновления.</div>`;
  yearIdx = Math.max(0, Math.min(years.length - 1, yearIdx));
  const y = years[yearIdx];
  const lab = y.periodLabel === "тр" ? "тр" : "пер.";
  const termKeys = y.terms.map((t) => String(t.number));
  let sel = termSel[y.label];
  if (!sel || (sel !== "final" && !termKeys.includes(sel))) sel = y.current ? (termKeys[termKeys.length - 1] || "final") : "final";
  termSel[y.label] = sel;
  let out = yearNavHtml(years, y);
  out += seg([...y.terms.map((t) => [String(t.number), `${t.number} ${lab}`]), ["final", "Итог"]], sel, "data-term", "small");

  if (sel === "final") {
    const cols = y.columns || 3;
    out += `<div class="fin" style="--cols:${cols + 1}"><div class="h">Предмет</div>${Array.from({ length: cols }, (_, i) => `<div class="h">${i + 1} ${lab}</div>`).join("")}<div class="h">Год</div>`;
    for (const r of y.final) {
      out += `<div class="rowline"></div><div class="sn">${esc(r.name)}</div>${Array.from({ length: cols }, (_, i) => `<div class="c">${markChip(r.periods[i])}</div>`).join("")}<div class="c">${markChip(r.year)}</div>`;
    }
    out += `</div>`;
    if (!y.final.length) out = out.replace(/<div class="fin".*$/s, `<div class="empty">Итоговых оценок за этот год пока нет.</div>`);
    return out + `<div class="term-sub" style="margin-top:10px">«–» — оценка за период ещё не выставлена.</div>` + attendanceYear(y);
  }
  const t = y.terms.find((x) => String(x.number) === sel);
  const att = t && t.attendance ? `<div style="margin-top:12px">${attendanceCard(t.attendance, "Посещаемость", true, schoolDayStats(t, y))}</div>` : "";   // внизу экрана
  if (!t || !t.subjects.length) return out + `<div class="empty">${emptyArt("sprout")}В этом периоде оценок пока нет.</div>` + att;
  out += `<div class="cards2" style="margin-top:12px">`;
  for (const sb of t.subjects) {
    const s = subj(sb.name);
    out += `<div class="card" style="${s.style}"><div class="subjhead"><div class="ic">${s.icon}</div><b>${esc(sb.name)}</b>
      ${sb.average ? `<div class="avg">средний<strong>${esc(sb.average)}</strong></div>` : ""}</div>
      <div class="chips">${sb.marks.map((m) => markChip(m)).join("")}</div></div>`;
  }
  return out + `</div>` + att;
}

function viewMarks() {
  const hasYears = (data.years || []).length > 0;
  const tabs = hasYears ? seg([["now", "Сейчас"], ["years", "Годы и итоги"], ["att", "Посещаемость"]], marksView, "data-mview", "three") : "";
  if (hasYears && marksView === "years") return [tabs + viewYears(), ""];
  if (hasYears && marksView === "att") return [tabs + viewAttendance(), ""];
  const marks = allMarks();
  if (!marks.length) return [tabs + ratingPlaques() + `<div class="empty">${emptyArt("star")}Оценок пока нет.</div>`, ""];
  const by = {};
  for (const m of marks) (by[m.subject] ??= []).push(m);               // оценки каждого предмета: сначала самые новые
  const names = Object.keys(by).sort((a, b) => (by[b][0].created > by[a][0].created ? 1 : by[b][0].created < by[a][0].created ? -1 : a.localeCompare(b, "ru")));
  let out = tabs + ratingPlaques() + `<div class="cards2">${names.map((n) => subjectCard(n, by[n])).join("")}</div>`;
  out += currentAttendanceCard() ? `<div style="margin-top:12px">${currentAttendanceCard()}</div>` : "";     // посещаемость внизу экрана
  return [out, ""];
}

// ---------- Расписание ----------
// ---------- Учителя ----------
let planView = "days";
const teachersOf = (subject) => data?.teachers?.[subject] || [];
const teacherShort = (subject) => (settings.teachers ? teachersOf(subject).map((t) => t.short || t.name).join(", ") : "");
function viewTeachers() {
  const names = Object.keys(data.teachers || {}).filter((n) => (data.teachers[n] || []).length).sort((a, b) => a.localeCompare(b, "ru"));
  if (!names.length) return `<div class="empty">${emptyArt("teacher")}Учителя появятся после следующего обновления.</div>`;
  return `<div class="card">${names.map((n) => {
    const s = subj(n);
    return `<div class="teacher-row" style="${s.style}"><div class="ic">${s.icon}</div><div><b>${esc(n)}</b>${teachersOf(n).map((t) =>
      `<div class="tn">${esc(t.name)}${t.role ? ` <span class="tr">· ${esc(t.role)}</span>` : ""}</div>`).join("")}</div></div>`;
  }).join("")}</div>`;
}

function viewPlan() {
  const hasTeachers = Object.values(data.teachers || {}).some((t) => t.length);
  const ptabs = hasTeachers ? seg([["days", "Расписание"], ["teachers", "Учителя"]], planView, "data-pview") : "";
  if (hasTeachers && planView === "teachers") return [ptabs + viewTeachers(), ""];
  const dates = data.days.filter((d) => d.lessons.length).map((d) => d.date);
  if (!dates.length) return [ptabs + `<div class="empty">${emptyArt("calendar")}Расписания пока нет.</div>`, ""];
  if (!planDate || !dates.includes(planDate)) planDate = dates.find((d) => d >= todayIso()) ?? dates[dates.length - 1];
  const out = ptabs + pagerHtml(dates, planDate, planTarget(dates)) + `<div class="plan-body ${pageAnim}" id="plan-body">${dayScheduleCard(planDate, "")}</div>` + swipeHint();
  pageAnim = "";
  return [out, ""];
}

// Переключение дня (в «Расписании» и в «Домашке» по одному дню): стрелками или свайпом
let pageAnim = "";
const pagedNow = () => !showSettings && !showSetup && !confirmStep && !markKey && !screens.length && !!data?.days?.length &&
  ((tab === "plan" && planView === "days") || (tab === "hw" && settings.hwMode === "pages"));
function shiftPage(delta) {
  const plan = tab === "plan";
  const dates = plan ? data.days.filter((d) => d.lessons.length).map((d) => d.date) : schoolDays().map((d) => d.date);
  const cur = plan ? planDate : hwDate;
  const next = Math.max(0, Math.min(dates.length - 1, dates.indexOf(cur) + delta));
  if (dates[next] === cur) return;
  if (plan) planDate = dates[next]; else hwDate = dates[next];
  pageAnim = delta > 0 ? "from-right" : "from-left";
  render();
}
let touch = null;
document.addEventListener("touchstart", (e) => {
  touch = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), el: e.target } : null;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touch && markKey && markList.length > 1 && e.target.closest?.(".markmodal")) {                  // листание оценок свайпом внутри карточки
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) markStep(dx < 0 ? 1 : -1);
    return;
  }
  if (!touch || !settings.swipe || !pagedNow()) return;
  if (touch.el?.closest?.(".rstrip, .chips, .nav, nav.tabs, header, .seg")) { touch = null; return; }      // лента оценок и кнопки листаются сами, дни не трогаем
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y, fast = Date.now() - touch.t < 900;
  touch = null;
  if (fast && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) shiftPage(dx < 0 ? 1 : -1);
}, { passive: true });

// ---------- События ----------
document.addEventListener("input", (e) => { if (e.target.matches?.("input[data-pname]")) pushState.name = e.target.value.slice(0, 30); });
document.addEventListener("change", (e) => {
  if (e.target.matches?.("input[data-pname]") && pushState.subscribed) {          // имя устройства сохраняем, когда закончили печатать
    pushState.name = e.target.value.slice(0, 30);
    (async () => { const sub = await (await pushReg())?.pushManager.getSubscription(); if (sub) await api("cgi-bin/push", { action: "update", endpoint: sub.endpoint, name: pushState.name }); })();
    return;
  }
  const t = e.target.closest?.("input[data-pq]");                                 // время тихих часов
  if (t && /^\d\d:\d\d$/.test(t.value)) { pushState.prefs = pushState.prefs || defaultPrefs(); pushState.prefs.quiet[t.dataset.pq] = t.value; savePushPrefs(); }
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "setup-form") { e.preventDefault(); submitSetup(e.target); }
  if (e.target.id === "lock-form") { e.preventDefault(); submitLock(e.target); }
  if (e.target.id === "pass-form") { e.preventDefault(); submitPass(e.target); }
});

document.addEventListener("click", (e) => {
  const pu = e.target.closest("[data-push]");
  if (pu) { const v = pu.dataset.push; if (v === "enable") enablePush(); else if (v === "test") testPush(); else if (v === "disable") disablePush(); return; }
  const pf = e.target.closest("[data-pf]");
  if (pf) { pushState.prefs = pushState.prefs || defaultPrefs(); pushState.prefs.types[pf.dataset.pf] = !pushState.prefs.types[pf.dataset.pf]; render(); savePushPrefs(); return; }
  const pq = e.target.closest("button[data-pq]");
  if (pq) { pushState.prefs = pushState.prefs || defaultPrefs(); pushState.prefs.quiet.on = !pushState.prefs.quiet.on; render(); savePushPrefs(); return; }
  if (e.target.closest("[data-mark-close]")) { closeMark(); return; }
  const mn = e.target.closest("[data-mark-nav]");
  if (mn) { markStep(Number(mn.dataset.markNav)); return; }
  const mk = e.target.closest("[data-mark]");
  if (mk) { openMark(mk.dataset.mark, mk); return; }
  if (e.target.closest("[data-scr-back]")) { backScreen(); return; }
  if (e.target.closest("[data-open-rating]")) { openScreen({ t: "rating" }); return; }
  const oc = e.target.closest("[data-open-cls]");
  if (oc) { openScreen({ t: "cls", name: oc.dataset.openCls }); return; }
  const rv = e.target.closest("[data-rview]");
  if (rv) { const sc = screens[screens.length - 1]; if (sc?.t === "rating") { sc.view = rv.dataset.rview; renderScreen(); } return; }
  if (e.target.closest("[data-today]")) { goToday(); return; }
  const ob = e.target.closest("[data-open-board]");
  if (ob) { openScreen({ t: "board", name: ob.dataset.openBoard, mode: ob.dataset.bmode === "class" ? "class" : "all" }); return; }
  const os = e.target.closest("[data-open-subject]");
  if (os) { openScreen({ t: "subject", name: os.dataset.openSubject }); return; }
  const ol = e.target.closest("[data-open-lesson]");
  if (ol) { openScreen({ t: "lesson", key: ol.dataset.openLesson }); return; }
  if (e.target.closest("[data-bmode-toggle]")) { const sc = screens[screens.length - 1]; if (sc?.t === "board") { sc.mode = sc.mode === "class" ? "all" : "class"; renderScreen(); } return; }
  if (e.target.closest("[data-share]")) { shareScreen(); return; }
  const ld = e.target.closest("[data-lesson-done]");
  if (ld) { const done = store.get("done", {}), k = ld.dataset.lessonDone; done[k] ? delete done[k] : (done[k] = 1); store.set("done", done); renderScreen(); render(); return; }
  const ch = e.target.closest("[data-copy-hw]");
  if (ch) { const [d, li] = ch.dataset.copyHw.split("|"); const l = data.days.find((x) => x.date === d)?.lessons[Number(li)]; if (l) copyText(l.homework, "Задание скопировано"); return; }
  const pa = e.target.closest("[data-pass]");
  if (pa) {
    const v = pa.dataset.pass;
    if (v === "logout") { passLogout(); return; }
    passForm = v === "cancel" ? null : v; passMsg = null; render();
    const first = document.querySelector("#pass-form input"); if (first) first.focus();
    return;
  }
  if (e.target.closest("[data-settings-close]")) { showSettings = false; render(); window.scrollTo(0, 0); return; }
  const st = e.target.closest("[data-set]");
  if (st) {
    const key = st.dataset.set, raw = st.dataset.val, val = key === "scale" ? Number(raw) : raw;
    if (CHOICES[key]?.includes(val)) { setSetting(key, val); const y = window.scrollY; render(); window.scrollTo(0, y); }
    return;
  }
  const fl = e.target.closest("[data-flip]");
  if (fl) { setSetting(fl.dataset.flip, !settings[fl.dataset.flip]); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (e.target.closest("[data-clear-done]")) {
    if (!askClearDone) askClearDone = true; else { try { localStorage.removeItem("done"); } catch {} askClearDone = false; }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.closest("[data-reset-settings]")) {
    settings = { ...DEFAULTS }; store.set("settings", settings); applySettings(); showPast = settings.showPast; askClearDone = false;
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.closest("[data-change-login]")) { confirmStep = 1; confirmError = ""; render(); return; }
  const cf = e.target.closest("[data-confirm]");
  if (cf) {
    if (cf.dataset.confirm === "no") { closeConfirm(); return; }
    if (cf.disabled || confirmBusy) return;
    if (confirmStep === 1) startLogout(); else finishLogout();
    return;
  }
  if (e.target.matches("[data-modal-back]")) { if (markKey) { closeMark(); return; } if (!confirmBusy) closeConfirm(); return; }
  if (e.target.closest("[data-setup-cancel]")) { showSetup = false; setupMsg = null; render(); return; }
  if (e.target.closest("[data-restore]")) { restoreLogin(); return; }
  if (e.target.closest("[data-setup]")) { showSetup = !showSetup; setupMsg = null; render(); window.scrollTo(0, 0); return; }
  const mv = e.target.closest("[data-mview]");
  if (mv) { enterAnim = marksView !== mv.dataset.mview; marksView = mv.dataset.mview; attDay = null; render(); return; }
  const ad = e.target.closest("[data-aday]");
  if (ad) { attDay = attDay === ad.dataset.aday ? null : ad.dataset.aday; const y0 = window.scrollY; render(); window.scrollTo(0, y0); return; }
  const at = e.target.closest("[data-aterm]");
  if (at) { const y = (data.years || [])[yearIdx]; if (y) attTerm[y.label] = at.dataset.aterm; attDay = null; render(); return; }
  const pv = e.target.closest("[data-pview]");
  if (pv) { planView = pv.dataset.pview; render(); return; }
  const yb = e.target.closest("[data-year]");
  if (yb) { yearIdx += Number(yb.dataset.year); attDay = null; render(); return; }
  const tb = e.target.closest("[data-term]");
  if (tb) { const y = (data.years || [])[yearIdx]; if (y) termSel[y.label] = tb.dataset.term; render(); return; }
  const tabBtn = e.target.closest("nav.tabs button");
  if (tabBtn) {
    const order = ["hw", "marks", "plan"], from = order.indexOf(tab);
    const entering = tab !== tabBtn.dataset.tab || showSettings;
    enterAnim = entering; tab = tabBtn.dataset.tab; showSettings = false; askClearDone = false; render(); window.scrollTo(0, 0);
    if (entering) { const m = $("#main"); m.classList.remove("slide-l", "slide-r"); void m.offsetWidth; m.classList.add(order.indexOf(tab) >= from ? "slide-r" : "slide-l"); }
    return;
  }
  const check = e.target.closest(".check");
  if (check) {
    const strip = check.closest(".strip"), done = store.get("done", {}), k = strip.dataset.key;
    done[k] ? delete done[k] : (done[k] = 1);
    store.set("done", done);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    return;
  }
  if (e.target.closest("[data-past]")) { showPast = !showPast; render(); return; }
  const head = e.target.closest("[data-toggle]");
  if (head) { head.parentElement.classList.toggle("open"); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) shiftPage(Number(nav.dataset.nav));
});

$("#gear").addEventListener("click", () => { showSettings = !showSettings; askClearDone = false; passForm = null; passMsg = null; render(); window.scrollTo(0, 0); });

$("#refresh").addEventListener("click", async () => {
  const b = $("#refresh"); b.disabled = true; $("#ricon").className = "spin";
  try { await fetch("cgi-bin/refresh", { method: "POST" }); } catch {}
  setTimeout(async () => { await load(); b.disabled = false; $("#ricon").className = ""; }, 15000);
});

document.addEventListener("visibilitychange", () => { if (!document.hidden && !window.__DATA__ && !locked) load(); });
load();
</script>
