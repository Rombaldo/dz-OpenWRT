<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b63f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<title>Мой дневник</title>
<script>
// Тема и размер применяются до отрисовки, чтобы страница не мигала
try { const s = JSON.parse(localStorage.getItem("settings") || "{}");
  if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
  if ([0.8, 0.9, 1.1, 1.2].includes(s.scale)) document.documentElement.style.zoom = s.scale; } catch (e) {}
</script>
<style>
  /* ===================== Оформление «Мой дневник» 2.0 =====================
     Токены цвета и формы. Тёмная тема переопределяет только токены. */
  :root {
    --bg: #f3f5fb; --bg-2: #e9edf8; --card: #ffffff; --card-2: #f5f7fc; --ink: #131a33; --muted: #6a7390; --line: #e6e9f2;
    --brand: #3b63f0; --brand-2: #7454f5; --brand-ink: #ffffff; --brand-soft: #e8eeff; --brand-deep: #1b2a7a;
    --ok: #13a057; --ok-soft: #dff6e9;
    --shadow: 0 1px 1px rgba(16,24,64,.04), 0 6px 20px rgba(16,24,64,.07);
    --shadow-lg: 0 18px 50px rgba(16,24,64,.20);
    --m5: #20b05c; --m4: #78c03f; --m3: #f4a321; --m2: #ef6a39; --m1: #e03a48; --mx: #8b94ab;
    --banner-warn-bg: #fff3d6; --banner-warn-ink: #6a4700; --banner-bad-bg: #ffe3e3; --banner-bad-ink: #7d1d1d;
    --banner-info-bg: #e4eaff; --banner-info-ink: #263b8c;
    --soft: #f1f4fc; --strip-bg: #e3ebff; --strip-edge: #c6d3fb; --strip-check: #ffffff;
    --warn-bg: #fff0e0; --warn-ink: #b45309;
    --c-ill-bg: #fff0d6; --c-ill: #b45309; --c-abs-bg: #ffe0e0; --c-abs: #b3261e; --c-late-bg: #e7ddff; --c-late: #5a3fc0;
    --glass: rgba(255,255,255,.78); --glass-line: rgba(255,255,255,.9);
    --navy-1: #1f4fd0; --navy-2: #0a1452; --night-1: #0d4ad8; --night-2: #061a5c; --night-3: #030b2c;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: light;
  }
  /* Тёмная тема: выбрана вручную или включена на устройстве (если не выбрана светлая). Значения ниже записаны дважды. */
  :root[data-theme="dark"] {
    --bg: #0b0f1d; --bg-2: #10162a; --card: #161c30; --card-2: #1c2339; --ink: #eef1fb; --muted: #96a0bc; --line: #262e48;
    --brand: #7b93ff; --brand-2: #a98bff; --brand-ink: #0b0f1d; --brand-soft: #222b55; --brand-deep: #c9d4ff;
    --ok: #45c47a; --ok-soft: #15321f;
    --shadow: 0 1px 1px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
    --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
    --banner-warn-bg: #3a2f12; --banner-warn-ink: #ffd9a0; --banner-bad-bg: #3b1a1a; --banner-bad-ink: #ffbcbc;
    --banner-info-bg: #1d2850; --banner-info-ink: #c7d4ff;
    --soft: #1c2339; --strip-bg: #222c55; --strip-edge: #3e4b85; --strip-check: transparent;
    --warn-bg: #3a2a14; --warn-ink: #ffc277;
    --c-ill-bg: #4a3716; --c-ill: #ffc277; --c-abs-bg: #4a1d1d; --c-abs: #ff9b95; --c-late-bg: #2f2656; --c-late: #c7b6ff;
    --glass: rgba(22,28,48,.8); --glass-line: rgba(255,255,255,.08);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f1d; --bg-2: #10162a; --card: #161c30; --card-2: #1c2339; --ink: #eef1fb; --muted: #96a0bc; --line: #262e48;
      --brand: #7b93ff; --brand-2: #a98bff; --brand-ink: #0b0f1d; --brand-soft: #222b55; --brand-deep: #c9d4ff;
      --ok: #45c47a; --ok-soft: #15321f;
      --shadow: 0 1px 1px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
      --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
      --banner-warn-bg: #3a2f12; --banner-warn-ink: #ffd9a0; --banner-bad-bg: #3b1a1a; --banner-bad-ink: #ffbcbc;
      --banner-info-bg: #1d2850; --banner-info-ink: #c7d4ff;
      --soft: #1c2339; --strip-bg: #222c55; --strip-edge: #3e4b85; --strip-check: transparent;
      --warn-bg: #3a2a14; --warn-ink: #ffc277;
      --c-ill-bg: #4a3716; --c-ill: #ffc277; --c-abs-bg: #4a1d1d; --c-abs: #ff9b95; --c-late-bg: #2f2656; --c-late: #c7b6ff;
      --glass: rgba(22,28,48,.8); --glass-line: rgba(255,255,255,.08);
      color-scheme: dark;
    }
  }
  /* Проверка уведомлений по шагам */
  .diag { list-style: none; margin: 12px 0 4px; padding: 0; display: grid; gap: 8px; }
  .diag li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: var(--soft); transition: background .3s, transform .3s var(--ease); animation: rise .35s var(--ease) both; }
  .diag .di { width: 26px; height: 26px; min-width: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; background: var(--line); color: var(--muted); transition: background .3s, color .3s; }
  .diag li.run .di { background: var(--brand-soft); color: var(--brand); animation: pulse 1.1s ease-in-out infinite; }
  .diag li.ok .di { background: var(--ok); color: #fff; animation: pop .4s var(--ease); }
  .diag li.bad { background: var(--banner-bad-bg); } .diag li.bad .di { background: var(--m1); color: #fff; }
  .diag li div { min-width: 0; } .diag b { display: block; font-size: 16px; } .diag small { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; margin-top: 2px; }
  @keyframes pulse { 50% { transform: scale(1.14); opacity: .75; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Один размер текста на всех экранах; крупнее или мельче делается в «Настройках» (zoom на странице целиком) */
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.42 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:active:not(:disabled) { transform: scale(.97); }
  button { transition: transform .12s var(--ease), background-color .2s, color .2s, box-shadow .2s, opacity .2s; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- шапка ---- */
  header { background: linear-gradient(135deg, var(--navy-1) 0%, var(--brand) 45%, var(--brand-2) 100%); color: #fff; position: relative; overflow: hidden;
    padding: calc(10px + env(safe-area-inset-top)) 16px 14px; border-radius: 0 0 26px 26px; }
  header::before, header::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  header::before { width: 260px; height: 260px; right: -90px; top: -120px; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); }
  header::after { width: 180px; height: 180px; left: -60px; bottom: -110px; background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,0) 70%); }
  .head-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .head-in .grow { flex: 1; min-width: 0; }
  .avatar { width: 42px; height: 42px; min-width: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px;
    background: rgba(255,255,255,.22); box-shadow: 0 0 0 2px rgba(255,255,255,.45) inset; }
  .hello { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin: 0; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { flex-wrap: nowrap; min-width: 0; align-items: baseline; }
  .meta .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .meta .who:not(:empty)::after { content: " ·"; }
  @media (max-width: 600px) { .meta .who { display: none; } }
  .meta { display: flex; flex-wrap: wrap; gap: 0 10px; margin-top: 2px; }
  .sub { font-size: 13px; opacity: .85; }
  .who { font-size: 14px; font-weight: 600; opacity: .95; overflow-wrap: anywhere; }
  .refresh, .gear { background: rgba(255,255,255,.18); border: 0; border-radius: 50%; width: 44px; height: 44px; min-width: 44px; padding: 0; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(255,255,255,.25) inset; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .refresh .rlabel { display: none; }
  .refresh svg, .gear svg { width: 22px; height: 22px; }
  .refresh:active, .gear:active, .gear.on { background: rgba(255,255,255,.34); }
  .spin { display: inline-flex; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 0; position: relative; z-index: 2; }
  .grid > div > :first-child, .aside > h2:first-child { margin-top: 0; }
  .grid { display: block; }
  @media (min-width: 960px) { .grid.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; } }
  .aside { display: none; }
  @media (min-width: 960px) { .aside { display: block; } }
  /* Вход в вкладку: лёгкое появление карточек по очереди */
  .enter > * { animation: rise .38s var(--ease) both; }
  .enter > *:nth-child(2) { animation-delay: .04s; } .enter > *:nth-child(3) { animation-delay: .08s; } .enter > *:nth-child(4) { animation-delay: .12s; }
  .enter > *:nth-child(5) { animation-delay: .16s; } .enter > *:nth-child(n+6) { animation-delay: .2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .banner { border-radius: 18px; padding: 12px 16px; margin: 0 0 12px; font-size: 16px; box-shadow: var(--shadow); }
  .banner.warn { background: var(--banner-warn-bg); color: var(--banner-warn-ink); }
  .banner.bad { background: var(--banner-bad-bg); color: var(--banner-bad-ink); }
  .banner.info { background: var(--banner-info-bg); color: var(--banner-info-ink); }

  .hero { background: var(--card); border-radius: 24px; padding: 18px; margin: 0 0 8px; box-shadow: var(--shadow); }
  .hero .big { font-size: 22px; font-weight: 800; line-height: 1.25; }
  .hero .small { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .bar { height: 10px; background: var(--brand-soft); border-radius: 99px; margin-top: 14px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-radius: 99px; transition: width .5s var(--ease); }
  .hero.all-done .bar > i { background: linear-gradient(90deg, #35c46f, #13a057); }
  .hero.all-done { background: var(--ok-soft); }

  h2 { font-size: 20px; font-weight: 800; letter-spacing: -.2px; margin: 24px 4px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 99px; background: var(--brand); color: #fff; }
  .tag.soft { background: var(--brand-soft); color: var(--brand); }

  /* ---- карточки ---- */
  .card { background: var(--card); border-radius: 22px; padding: 14px 16px; margin: 0 0 12px; box-shadow: var(--shadow); }
  .hw { display: flex; gap: 14px; align-items: center; border-left: 6px solid var(--c, var(--brand)); transition: opacity .2s; }
  .ic { width: 48px; height: 48px; min-width: 48px; border-radius: 15px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; background: var(--cbg, var(--brand-soft)); }
  .hw .body { flex: 1; min-width: 0; }
  .hw .subj { font-weight: 800; font-size: 19px; }
  .hw .time { display: block; color: var(--muted); font-size: 14px; font-weight: 500; }
  @media (max-width: 480px) {
    .hw { gap: 10px; padding: 12px 12px 12px 10px; }
    .hw .ic { width: 42px; height: 42px; min-width: 42px; font-size: 23px; border-radius: 13px; }
    .check { width: 50px; height: 50px; min-width: 50px; }
    .hw .text { font-size: 18px; }
    .hello { font-size: 21px; }
  }
  .hw .text { margin-top: 3px; font-size: 19px; overflow-wrap: anywhere; }
  .hw .files { margin-top: 6px; color: var(--muted); font-size: 14px; }
  .check { width: 52px; height: 52px; min-width: 52px; border-radius: 50%; border: 2.5px solid var(--line); background: transparent;
    font-size: 26px; line-height: 1; color: transparent; }
  .hw.done { opacity: .6; }
  .hw.done .check { background: var(--ok); border-color: var(--ok); color: #fff; animation: pop .35s var(--ease); }
  .hw.done .text { text-decoration: line-through; }
  .none { color: var(--muted); font-size: 15px; margin: 2px 4px 8px; }
  .free { background: var(--card); border-radius: 18px; padding: 12px 16px; margin: 0 0 10px; color: var(--muted); font-size: 16px; box-shadow: var(--shadow); }

  /* ---- оценки ---- */
  .mark { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 46px; padding: 0 8px; border-radius: 14px;
    font-weight: 800; font-size: 23px; color: #fff; background: var(--mx); font-variant-numeric: tabular-nums;
    box-shadow: 0 -2px 0 rgba(0,0,0,.12) inset, 0 1px 2px rgba(16,24,64,.12); }
  .m5 { background: var(--m5); } .m4 { background: var(--m4); } .m3 { background: var(--m3); } .m2 { background: var(--m2); } .m1 { background: var(--m1); }
  .mark.sm { min-width: 36px; height: 36px; font-size: 18px; border-radius: 11px; }
  .mark.xs { min-width: 26px; height: 26px; font-size: 14px; border-radius: 8px; padding: 0 5px; box-shadow: none; }
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 2px; }
  .row:last-child { padding-bottom: 2px; }
  .row .mark { width: 58px; min-width: 58px; padding: 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 18px; }
  .row .t span { color: var(--muted); font-size: 14px; }
  .row .t span.new, .new { font-size: 11px; font-weight: 800; background: #ff5a7a; color: #fff; padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; display: inline; }
  .ver { text-align: center; color: var(--muted); font-size: 12px; margin: 26px 0 4px; opacity: .7; }
  .cards2 { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
  @media (min-width: 700px) { .cards2 { grid-template-columns: 1fr 1fr; } }
  .lesson .t span.theme { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .subjhead { display: flex; align-items: center; gap: 12px; }
  .subjhead .ic { width: 44px; height: 44px; min-width: 44px; font-size: 23px; border-radius: 14px; }
  .subjhead b { flex: 1; font-size: 19px; }
  .avg { color: var(--muted); font-size: 15px; text-align: right; line-height: 1.2; }
  .avg strong { display: block; color: var(--ink); font-size: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  /* ---- расписание и листание дней ---- */
  .plan-body { touch-action: pan-y; min-height: 55vh; }
  .plan-body.from-right { animation: fromRight .26s var(--ease); } .plan-body.from-left { animation: fromLeft .26s var(--ease); }
  @keyframes fromRight { from { opacity: 0; transform: translateX(44px); } to { opacity: 1; transform: none; } }
  @keyframes fromLeft { from { opacity: 0; transform: translateX(-44px); } to { opacity: 1; transform: none; } }
  .swipehint { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .nav { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; background: var(--card); border-radius: 22px; padding: 8px; box-shadow: var(--shadow); }
  .nav button { background: var(--card-2); border: 0; border-radius: 16px; min-width: 52px; min-height: 52px; font-size: 26px; color: var(--brand); }
  .nav button:disabled { opacity: .35; }
  .nav .ttl { flex: 1; text-align: center; font-weight: 800; font-size: 20px; line-height: 1.2; background: transparent; padding: 4px; border-radius: 14px; min-width: 0; color: var(--ink); }
  .nav .ttl:active { background: var(--card-2); }
  .nav .ttl small { display: block; font-weight: 500; color: var(--muted); font-size: 15px; }
  .nav .ttl .totoday { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); padding: 2px 10px; border-radius: 99px; }
  .lesson { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .lesson:first-child { border-top: 0; padding-top: 2px; }
  .lesson:last-child { padding-bottom: 2px; }
  .lesson .n { width: 20px; text-align: center; color: var(--muted); font-weight: 800; }
  .lesson .t { flex: 1; min-width: 0; }
  .lesson .t b { font-size: 18px; }
  .lesson .t span { display: block; color: var(--muted); font-size: 14px; }
  .lesson.off { opacity: .5; } .lesson.off b { text-decoration: line-through; }
  .lesson.now { background: var(--brand-soft); border-radius: 16px; padding: 10px 10px; margin: 0 -10px; border-top-color: transparent; }
  .now-tag { font-size: 11px; font-weight: 800; background: var(--brand); color: #fff; padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; }
  .lesson .ic { width: 44px; height: 44px; min-width: 44px; font-size: 23px; border-radius: 14px; }

  /* ---- дни во вкладке «Домашка» ---- */
  .day { background: var(--card); border-radius: 22px; padding: 16px 16px 8px; margin: 0 0 14px; box-shadow: var(--shadow); scroll-margin-top: 12px; }
  .dtitle { font-size: 21px; font-weight: 800; line-height: 1.25; letter-spacing: -.2px; }
  .dtitle.tap:active { opacity: .7; }
  .rel { color: var(--brand); }
  .dprog { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 16px; }
  .dprog b { color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; }
  .dpi { width: 30px; height: 30px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
  .day .bar { margin: 12px 0 12px; height: 10px; }
  .day.all-done .bar > i { background: linear-gradient(90deg, #35c46f, #13a057); }
  .cheer { background: var(--ok-soft); color: var(--ok); font-weight: 700; border-radius: 14px; padding: 10px 14px; margin: 0 0 12px; font-size: 16px; animation: rise .4s var(--ease); }
  .lessons2 { display: block; }
  .lesson2 { background: var(--card-2); border-radius: 18px; padding: 6px 10px 10px; margin: 0 0 10px; border-left: 4px solid var(--c, var(--brand)); }
  .lesson2.off { opacity: .55; }
  .lhead { display: flex; align-items: center; gap: 12px; padding: 8px 2px; cursor: pointer; }
  .lic { width: 44px; height: 44px; min-width: 44px; border-radius: 14px; background: var(--cbg, var(--brand-soft)); display: flex; align-items: center; justify-content: center; font-size: 23px; }
  .lt { flex: 1; min-width: 0; } .lt b { display: block; font-size: 18px; line-height: 1.25; } .lt span { color: var(--muted); font-size: 14px; }
  .chev { color: var(--brand); font-size: 26px; line-height: 1; transition: transform .2s var(--ease); padding: 0 4px; }
  .lesson2.open .chev { transform: rotate(90deg); }
  .ldetails { display: none; color: var(--muted); font-size: 15px; padding: 2px 4px 8px; }
  .lesson2.open .ldetails { display: block; animation: rise .25s var(--ease); }
  .strip { display: flex; align-items: center; gap: 12px; background: var(--strip-bg); border-radius: 14px; padding: 10px 10px 10px 14px; }
  .strip .stext { flex: 1; min-width: 0; }
  .strip .text { font-size: 18px; margin: 0; overflow-wrap: anywhere; line-height: 1.35; }

  }

  .markmodal { position: relative; }
  .mm-head { display: flex; align-items: flex-start; gap: 12px; }

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },

// ---------- Настройки (хранятся на самом устройстве, у каждого телефона свои) ----------
const DEFAULTS = { theme: "auto", scale: 1, swipe: true, hwMode: "feed", showPast: false, teachers: true, startTab: "hw" };
const CHOICES = {
  theme: ["auto", "light", "dark"], scale: [0.8, 0.9, 1, 1.1, 1.2], hwMode: ["feed", "pages"], startTab: ["hw", "marks", "plan"],
};
function loadSettings() {
  let raw = store.get("settings", {});
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) raw = {};
  const s = { ...DEFAULTS };
  for (const k of Object.keys(DEFAULTS)) {          // берём только известные и допустимые значения
    if (!(k in raw)) continue;
    if (CHOICES[k] ? CHOICES[k].includes(raw[k]) : typeof raw[k] === typeof DEFAULTS[k]) s[k] = raw[k];
  }
  return s;
}
let settings = loadSettings(), showSettings = false, askClearDone = false;
function applySettings() {
  const root = document.documentElement;
  if (settings.theme === "auto") delete root.dataset.theme; else root.dataset.theme = settings.theme;
  root.style.zoom = settings.scale === 1 ? "" : String(settings.scale);
}
function setSetting(key, value) {
  settings[key] = value;
  store.set("settings", settings);
  applySettings();
  if (key === "showPast") showPast = value;
}
applySettings();

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayIso = () => iso(new Date());
const dayName = (s) => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
function rel(s) {
  const diff = Math.round((parse(s) - parse(todayIso())) / 864e5);
  return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : diff === -1 ? "Вчера" : null;
}
const noHw = (t) => !t || /^(без\s+(домашнего\s+)?задани[яе]\.?|нет\s+домашнего\s+задания\.?|-|—)$/i.test(t.trim());
const hhmm = (s) => { const [h, m] = (s || "0:0").split(":").map(Number); return h * 60 + m; };

async function load() {
  if (window.__DATA__) {
    data = window.__DATA__;
    config = data.config || {};
    banner = `<div class="banner info">Это сохранённая копия. Чтобы увидеть свежее, открой дневник с домашним интернетом.</div>`;
    return render();
  }
  try {
    const r = await fetch("cgi-bin/data", { cache: "no-store" });
    let body = null; try { body = await r.json(); } catch {}
    if (r.status === 401 || body?.auth === true) { locked = true; data = null; config = {}; showSettings = false; await loadHint(); return render(); }   // нужен пароль семьи
    if (!r.ok || !body) throw new Error(r.status);
    locked = false;
    data = body;
    store.set("cache", data);
    banner = "";
  } catch {
    data = store.get("cache", null);
    banner = data
      ? `<div class="banner warn">Нет связи с домом. Показываю то, что было видно в прошлый раз.</div>`
      : `<div class="banner bad">Нет связи с домашним компьютером, и сохранённых данных пока нет. Подключись к домашнему Wi-Fi.</div>`;
  }
  config = data?.config || {};
  render();
}

async function submitSetup(form) {
  const login = form.login.value.trim(), password = form.password.value;
  setupLogin = login;
  if (!login || !password) { setupMsg = { ok: false, text: "Введите логин и пароль." }; return render(); }
  const btn = form.querySelector("button.go"); btn.disabled = true; btn.textContent = "Проверяю…";
  let res;
  try {
    const r = await fetch("cgi-bin/setup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login, password }) });
    res = await r.json();
    if (noteLocked(r, res)) return;
  } catch { res = { ok: false, message: "Не получилось связаться с роутером. Проверьте Wi-Fi и попробуйте снова." }; }
  form.password.value = "";
  setupMsg = { ok: !!res.ok, text: res.message || "Не получилось." };
  if (!res.ok) return render();
  setupWait = true; render();
  await waitForDiary();
}

async function waitForDiary() {            // ждём до ~2.5 минут, пока дневник загрузится
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 4000));
    try {
      const d = await (await fetch("cgi-bin/data", { cache: "no-store" })).json();
      if (d.days?.length && !d.status?.needLogin) { data = d; store.set("cache", d); break; }
    } catch {}
  }
  setupWait = false; showSetup = false; setupMsg = null; setupLogin = "";
  load();
}

async function restoreLogin() {            // вернуть вход, который был до выхода (в течение суток)
  const r = await api("cgi-bin/logout", { action: "restore" });
  setupMsg = { ok: !!r.ok, text: r.message || "Не получилось." };
  if (!r.ok) return render();
  setupWait = true; render();
  await waitForDiary();
}

async function api(path, body) {
  try {

document.addEventListener("keydown", (e) => {

  if (markKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { markStep(e.key === "ArrowRight" ? 1 : -1); return; }
  const mk = e.target.closest?.("[data-mark]");                                    // оценки — кнопки: открываются и с клавиатуры
  if (mk && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openMark(mk.dataset.mark, mk); return; }
  const rb = e.target.closest?.("[role=button][data-open-subject], [role=button][data-open-rating], [role=button][data-today]");     // плитки предметов и рейтинга: тоже с клавиатуры
  if (rb && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); rb.click(); }
});

function statusBanner() {
  let h = banner;
  const s = data?.status;
  if (s?.needLogin && data?.days?.length) h += `<div class="banner bad"><b>Нужно войти в Дневник.ру заново.</b> ${esc(s.error || "")} Пока показываю старые данные.${window.__DATA__ ? "" : `<br><button data-setup>Ввести логин и пароль</button>`}</div>`;
  else if (s?.error) h += `<div class="banner warn">Не получилось обновить с сайта, показываю прошлые данные.</div>`;
  if (data?.updatedAt && !s?.needLogin && (Date.now() - new Date(data.updatedAt)) / 36e5 > 24)
    h += `<div class="banner warn">Данные не обновлялись больше суток.</div>`;
  return h;
}

function greeting() {
  const h = new Date().getHours();
  const hi = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  const name = config.name || data?.student?.name;
  return name ? `${hi}, ${name}!` : `${hi}!`;
}

// Числа среднего балла и мест плавно «набегают» при входе во вкладку (если у человека не включено «меньше движения»)
function countUp(root) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || navigator.webdriver) return;      // автоматическим проверкам числа нужны сразу
  root.querySelectorAll(".avg2 strong, .atile strong, .dia, .plq span").forEach((el) => {
    const t = el.textContent.trim(), m = /^(\d+)(?:,(\d+))?$/.exec(t);
    if (!m) return;
    const dec = m[2] ? m[2].length : 0, to = parseFloat(t.replace(",", ".")), t0 = performance.now(), dur = 700;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur), v = to * (1 - Math.pow(1 - k, 3));
      el.textContent = (dec ? v.toFixed(dec) : String(Math.round(v))).replace(".", ",");
      if (k < 1) requestAnimationFrame(step); else el.textContent = t;
    };
    el.textContent = dec ? (0).toFixed(dec).replace(".", ",") : "0";
    requestAnimationFrame(step);
  });
}

let pushState = { name: "", loaded: false, loading: false, supported: false, why: "", ready: true, subscribed: false, perm: "default", prefs: null, busy: false, msg: null, events: null };

function pushSupport() {
  if (window.__DATA__) return { ok: false, why: "offline" };
  if (!window.isSecureContext) return { ok: false, why: "insecure" };
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    return { ok: false, why: ios && !standalone ? "ios-home" : "unsupported" };
  }
  return { ok: true };
}
const keyBytes = (b64) => Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(b64.length / 4) * 4, "=")), (c) => c.charCodeAt(0));

  if (pushState.loading) return;
  pushState.loading = true;
  const sup = pushSupport();
  pushState.supported = sup.ok; pushState.why = sup.why || "";
  if (sup.ok) {
    pushState.perm = Notification.permission;
    try {
      const sub = await (await pushReg())?.pushManager.getSubscription();
      if (sub) {
        const r = await api("cgi-bin/push", { action: "get", endpoint: sub.endpoint });
        pushState.subscribed = !!r.subscribed;
        if (r.subscribed) { pushState.prefs = r.prefs; pushState.name = r.name || ""; }
      }
    } catch {}
  }
  if (!window.__DATA__) {
    const e = await api("cgi-bin/push", { action: "events", limit: 6 });
    pushState.events = e.ok ? e.events || [] : [];
  }
  pushState.loaded = true; pushState.loading = false;
  if (showSettings) render();
}
async function enablePush() {
  pushState.busy = true; pushState.msg = null; render();

    const perm = await Notification.requestPermission();
    pushState.perm = perm;
    if (perm !== "granted") { pushState.msg = { ok: false, text: "Уведомления запрещены для этого сайта. Разрешите их в настройках браузера и попробуйте снова." }; return; }
    const cfg = await api("cgi-bin/push", { action: "config" });
    if (locked) return;
    if (!cfg.ready) { pushState.ready = false; pushState.msg = { ok: false, text: cfg.message || "На роутере не установлен модуль уведомлений." }; return; }
    const reg = await navigator.serviceWorker.register("sw.js", { scope: "./" });
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();

      const g = await api("cgi-bin/push", { action: "get", endpoint: sub.endpoint });
      if (!g.subscribed) { await sub.unsubscribe().catch(() => {}); sub = null; }
    }

    diagSet("perm", "ok");

    if (!sub) { diagSet("sub", "bad", "Это устройство ещё не подключено. Нажмите «Включить уведомления на этом устройстве»."); return; }
    diagSet("sub", "ok");

    const got = new Promise((res) => { diagWaiter = res; });
    const t0 = Date.now();

    pushState.msg = { ok: !!r.ok, text: r.message || (r.ok ? "Отправлено." : "Не получилось.") };
    if (!r.ok) { diagSet("test", "bad", "Роутер не смог отправить уведомление."); return; }

    if ((await Promise.race([got.then(() => "ok"), timeout])) === "ok") diagSet("test", "ok", `Пришло за ${Math.max(1, Math.round((Date.now() - t0) / 1000))} с.`);

}

let showPast = settings.showPast;

function fileChips(l) {
  // Файлы у нас не хранятся: открываются по ссылке прямо с сервера Дневник.ру (нужен интернет)
  return (l.files || []).map((f) => {
    const title = `${f.name}.${f.ext}`;
    if (f.url)
      return `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">
        <span class="fic">${f.ext === "pdf" ? "📄" : /^(jpe?g|png|gif|webp)$/.test(f.ext) ? "🖼️" : "📎"}</span>
        <span class="fn">${esc(title)}</span><span class="fs">${fmtSize(f.size)} · открыть</span></a>`;
    return `<div class="file off"><span class="fic">📎</span><span class="fn">${esc(title)}</span>
      <span class="fs">ссылка недоступна, смотри на сайте</span></div>`;
  }).join("");
}

function dayCard(d, done, focusId, paged = false) {
  const keyOf = (l) => `${d.date}|${l.subject}|${l.n}`;
  const list = d.lessons.filter((l) => hasHw(l));
  const dn = list.filter((l) => done[keyOf(l)]).length, total = list.length, rr = rel(d.date);
  const label = rr === "Сегодня" ? "ДЗ на сегодня" : "ДЗ на день";
  const allDone = total > 0 && dn === total;
  const lessons = d.lessons.map((l, li) => {
    const s = subj(l.subject), key = keyOf(l), isDone = !!done[key];
    const strip = hasHw(l) ? `<div class="strip ${isDone ? "done" : ""}" data-key="${esc(key)}">
        <div class="stext">${!noHw(l.homework) ? `<div class="text">${esc(l.homework)}</div>` : ""}${fileChips(l)}</div>
        <button class="check" aria-label="Сделано">✓</button></div>` : "";
    return `<div class="lesson2 ${l.canceled ? "off" : ""}" style="${s.style}">
      <div class="lhead" data-toggle><span class="lic">${s.icon}</span>
        <div class="lt"><b>${esc(l.n)}. ${esc(l.subject)}</b><span>${esc(l.start)}–${esc(l.end)}${l.canceled ? " · урок отменён" : ""}</span></div>
        ${l.marks.map((m, mi) => tapMark(d.date, li, mi, m, l.subject)).join("")}<span class="chev">›</span></div>
      <div class="ldetails">${teacherShort(l.subject) ? `<div><b>Учитель:</b> ${esc(teacherShort(l.subject))}</div>` : ""}${l.theme ? `<b>Тема урока:</b> ${esc(l.theme)}` : "Тема урока пока не указана"}</div>
      ${strip}</div>`;
  }).join("");
  return `<section class="day ${allDone ? "all-done" : ""}" ${d.date === focusId ? 'id="focus-day"' : ""}>${scene(d.date)}
    ${paged ? "" : `<div class="dtitle ${d.date === focusId ? "" : "tap"}" ${d.date === focusId ? "" : 'data-today role="button" tabindex="0" aria-label="Перейти к сегодняшнему дню"'}>${esc(WD[d.weekday] ?? d.weekday)}, ${dayName(d.date)}${rr ? ` <span class="rel">${rr}</span>` : ""}</div>`}
    <div class="dprog"><span class="dpi">☑</span>${total
      ? `<b>${dn}/${total}</b> <span>${label}</span>` : `<span>Домашки нет 🎉</span>`}</div>
    ${total ? `<div class="bar"><i style="width:${Math.round((dn / total) * 100)}%"></i></div>` : ""}
    ${allDone ? `<div class="cheer">Всё сделано! Можно отдыхать 🎉</div>` : ""}
    <div class="lessons2">${lessons}</div></section>`;
}

// Стрелки и заголовок дня: одинаковые в «Домашке» (по одному дню) и в «Расписании»
function pagerHtml(dates, date, target) {
  const i = dates.indexOf(date), day = data.days.find((d) => d.date === date), r = rel(date);
  const away = target && target !== date;
  return `<div class="nav">${scene(date)}<button data-nav="-1" ${i === 0 ? "disabled" : ""} aria-label="Раньше">‹</button>
    <button class="ttl" data-today aria-label="${away ? "Вернуться к сегодняшнему дню" : "Сегодняшний день"}">${r ? `<span class="rel">${r}</span>, ` : ""}${esc(WD[day.weekday] ?? "")}<small>${dayName(day.date)}</small>${away ? `<span class="totoday">↺ к сегодня</span>` : ""}</button>
    <button data-nav="1" ${i === dates.length - 1 ? "disabled" : ""} aria-label="Позже">›</button></div>`;
}
const planTarget = (dates) => dates.find((d) => d >= todayIso()) ?? dates[dates.length - 1];
function goToday() {                                   // нажали на дату: возвращаемся к сегодняшнему (или ближайшему учебному) дню
  if (tab === "plan") {
    const dates = data.days.filter((d) => d.lessons.length).map((d) => d.date), t = planTarget(dates);
    if (t && t !== planDate) { pageAnim = t > planDate ? "from-right" : "from-left"; planDate = t; render(); }
  } else if (settings.hwMode === "pages") {
    const dates = schoolDays().map((d) => d.date), t = focusDate() ?? dates[dates.length - 1];
    if (t && t !== hwDate) { pageAnim = t > hwDate ? "from-right" : "from-left"; hwDate = t; render(); }
  } else document.getElementById("focus-day")?.scrollIntoView({ behavior: "smooth", block: "start" });
}
const swipeHint = () => (settings.swipe ? `<div class="swipehint">Листай дни пальцем влево и вправо ↔</div>` : "");

function viewHw() {
  const focus = focusDate();
  const all = schoolDays();
  const done = store.get("done", {});
  if (settings.hwMode === "pages" && all.length) {                   // по одному дню, как в расписании
    const dates = all.map((d) => d.date);
    if (!hwDate || !dates.includes(hwDate)) hwDate = focus ?? dates[dates.length - 1];
    const out = pagerHtml(dates, hwDate, focus ?? dates[dates.length - 1]) + `<div class="plan-body ${pageAnim}" id="plan-body">${dayCard(all.find((d) => d.date === hwDate), done, focus, true)}</div>` + swipeHint();
    pageAnim = "";
    return [recentStrip() + out, ""];
  }
  if (!focus) return [recentStrip() + `<div class="empty">${emptyArt("calendar")}Ближайших уроков нет. Отдыхай!</div>`, ""];
  const past = all.filter((d) => d.date < focus).slice(-5), upcoming = all.filter((d) => d.date >= focus).slice(0, 6);
  let out = "";
  if (past.length) out += `<button class="pastbtn" data-past>${showPast ? "Скрыть прошлые дни ↓" : "↑ Показать прошлые дни"}</button>`;
  if (showPast) out += past.map((d) => dayCard(d, done, focus)).join("");
  out += upcoming.map((d) => dayCard(d, done, focus)).join("");
  return [recentStrip() + out, ""];
}

// ---------- Рейтинг и подробности оценок: данные, которые Дневник.ру сам показывает ученику (роутер их не угадывает и закрытое подпиской не берёт) ----------
const shortDate = (s) => { const d = parse(String(s).slice(0, 10)); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };       // месяцы пишем полностью, как везде
const ANIMALS = ["🐻", "🦊", "🐼", "🐯", "🦁", "🐸", "🐵", "🐰", "🦓", "🐨", "🐮", "🐷", "🦌", "🐙", "🐘", "🦝", "🦒", "🐹", "🐱", "🐶", "🦔", "🐺"];
const avatarOf = (a) => (a ? ANIMALS[a % ANIMALS.length] : "🙂");
const ratingData = () => data?.rating || null;
const ratingFor = (name) => (ratingData()?.subjects || []).find((x) => x.name === name) || null;
const fmtChange = (c) => String(c || "").replace(/^([+-])/, "$1 ");
const downChange = (c) => String(c || "").startsWith("-");
const MOOD = { Good: "good", Average: "mid", Bad: "bad" };     // «mid», а не «avg»: класс .avg уже занят подписью среднего балла
const mood = (m) => MOOD[m] || "good";
const R_P = 0, R_C = 1, R_M = 2, R_D = 3, R_K = 4, R_ME = 5, R_A = 6;     // столбцы строки списка параллели
const myRow = (rows) => rows.find((r) => r[R_ME]) || null;
function listFor(board, mode) {                                           // «class»: только свой класс по месту в классе; иначе вся параллель
  const me = myRow(board);
  if (mode === "class" && me) return board.filter((r) => r[R_C] === me[R_C]).sort((a, b) => (a[R_K] || 9999) - (b[R_K] || 9999));
  return board;
}
function around(rows) {                                                    // три строки: ученик и соседи
  const i = rows.findIndex((r) => r[R_ME]);
  if (i < 0) return rows.slice(0, 3);
  const st = Math.max(0, Math.min(i - 1, rows.length - 3));
  return rows.slice(st, st + 3);
}
const markNum = (m) => { const v = parseFloat(String(m || "").replace(",", ".")); return Number.isFinite(v) ? v : null; };
const barFrac = (m, sc) => {                                               // доля длины полоски: чем выше балл, тем длиннее (в списках «ёлочкой», внутри списка)
  const v = markNum(m);
  if (v == null) return 0.6;
  const lo = sc ? sc.lo : 2, hi = sc ? sc.hi : 5;
  return Math.max(0.3, Math.min(1, 0.5 + 0.5 * (v - lo) / (hi - lo)));
};
function barScale(rows) {                                                  // шкала списка: от самого низкого балла до самого высокого (не уже 0,25, иначе мелкая разница раздувается)
  const v = rows.map((r) => markNum(r[R_M])).filter((x) => x != null);
  if (!v.length) return null;
  const hi = Math.max(...v);
  return { hi, lo: Math.min(Math.min(...v), hi - 0.25) };
}
function classTone(idx, mine) {                                           // свой класс синий, остальные — розовый, зелёный, оранжевый
  if (idx === mine) return "";
  return ["alt", "c2", "c3"][(idx > mine ? idx - 1 : idx) % 3];
}

function boardRow(r, mode, myCls, classes, opt = {}) {
  const place = mode === "class" ? r[R_K] : r[R_P], mine = r[R_C] === myCls, name = classes[r[R_C]] || "", tone = classTone(r[R_C], myCls);
  const badge = mode === "class" ? `<span class="dia sm">${place}</span>` : `<span class="dw"><span class="cir ${tone}">${place}</span>${place === 1 ? `<i class="crown">👑</i>` : ""}</span>`;
  const who = r[R_ME] ? esc((data?.student?.name || "Я").slice(0, 1).toUpperCase()) : avatarOf(r[R_A]);
  const chg = r[R_D] ? `<span class="dl ${downChange(r[R_D]) ? "neg" : "pos"} ${r[R_ME] ? "solid" : ""}">${esc(fmtChange(r[R_D]))}</span>` : "";
  const has = mode === "all" && r[R_K] && mine;
  const right = has ? `<span class="rk"><span class="dia sm">${r[R_K]}</span><small>место<br>в ${esc(name)}</small></span>` : (opt.reserve ? `<span class="rk ph"></span>` : "");
  return `<div class="brow ${r[R_ME] ? "me" : ""}">${badge}<span class="bline" style="--f:${barFrac(r[R_M], opt.scale).toFixed(3)}"><span class="bar2 ${tone}"><span>${esc(name)}</span><i class="av ${r[R_ME] ? "own" : ""}">${who}</i></span>
    <span class="bm">${esc(r[R_M])}</span>${chg}</span>${right}</div>`;
}
function boardRows(rows, mode, myCls, classes, scaleRows = rows) {          // список строк: полоски одной шкалы, место справа занимает одно и то же место у всех
  const opt = { scale: barScale(scaleRows), reserve: mode === "all" && rows.some((r) => r[R_K] && r[R_C] === myCls) };
  const note = opt.reserve ? `<div class="rk-note"><i class="dia sm"></i> — место в своём классе</div>` : "";   // подпись у ромба: на телефоне вместо «место в 5А» (там не хватает ширины)
  return note + rows.map((x) => boardRow(x, mode, myCls, classes, opt)).join("");
}

// ---------- история мест: сайт показывает только сегодняшние места, прежние копит роутер (раз в день) ----------
const ratingHistory = () => ratingData()?.history || [];
function histAgo(days) {
  const lim = iso(new Date(Date.now() - days * 864e5)), h = ratingHistory();
  for (let i = h.length - 1; i >= 0; i--) if (h[i].d <= lim) return h[i];
  return null;
}
function pastPoints(get) {                                                  // до двух прошлых значений: неделю и две недели назад (или раньше, если истории меньше)
  const out = [];
  for (const days of [7, 14]) { const e = histAgo(days); if (e && get(e) && !out.some((o) => o.d === e.d)) out.push({ d: e.d, v: get(e) }); }
  if (!out.length) { const e = histAgo(1); if (e && get(e)) out.push({ d: e.d, v: get(e) }); }
  return out;
}
function pastLine(now, get) {                                              // коротко для плитки: «неделю назад: 19 ▲» (стрелка вверх — место стало выше)
  const p = pastPoints(get)[0];
  if (!p || !now) return "";
  const days = Math.round((parse(todayIso()) - parse(p.d)) / 864e5);
  const when = days >= 7 && days < 14 ? "неделю назад" : days === 1 ? "вчера" : shortDate(p.d);
  const dir = now < p.v ? "up" : now > p.v ? "down" : "";
  return `<span class="ph">${when}: <i>${p.v}</i>${dir ? ` <i class="${dir}">${dir === "up" ? "▲" : "▼"}</i>` : ""}</span>`;
}
function sparkChart() {                                                     // как менялось место: в классе и в параллели (выше — лучше)
  const r = ratingData(), h = [...ratingHistory()];
  const today = todayIso();
  if (!h.length || h[h.length - 1].d !== today) h.push({ d: today, c: r?.class?.place, p: r?.parallel?.place });
  const pts = h.filter((x) => x.c || x.p);
  if (pts.length < 2) return "";
  const W = 320, H = 120, pad = 16, n = pts.length;
  const series = (key) => {                                                // у каждой линии свой масштаб: видно, как место двигалось
    const vals = pts.map((x) => x[key]).filter(Boolean);
    if (!vals.length) return { line: "", end: "" };
    const lo = Math.min(...vals) - 1, hi = Math.max(...vals) + 1;
    const xy = pts.map((x, i) => x[key] ? [pad + (i * (W - 2 * pad - 22)) / (n - 1), pad + ((x[key] - lo) / (hi - lo)) * (H - 2 * pad)] : null).filter(Boolean);
    const [lx, ly] = xy[xy.length - 1];
    return { line: xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "), end: `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" class="dot ${key}"/><text x="${(lx + 8).toFixed(1)}" y="${(ly + 4).toFixed(1)}">${vals[vals.length - 1]}</text>` };
  };
  const c = series("c"), pp = series("p");
  return `<div class="scr-card"><div class="scr-card-h"><b>Как менялось место</b></div><div class="scr-note" style="margin:-6px 6px 8px">${shortDate(pts[0].d)} — сегодня</div>
    <div class="legend2"><span><i style="background:#ffd166"></i>в классе</span><span><i style="background:#7fb6ff"></i>в параллели</span></div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" aria-label="График мест"><polyline class="ln p" points="${pp.line}"/><polyline class="ln c" points="${c.line}"/>${pp.end}${c.end}</svg>
    <div class="note-calc">Чем выше линия, тем выше место. История копится с первого дня работы рейтинга в программе.</div></div>`;
}

// ---------- места классов: считаем сами по средним баллам учеников (в веб-версии сайта этого экрана нет) ----------
function classStats(board) {
  const by = {};
  for (const r of board || []) { const v = markNum(r[R_M]); if (v != null) (by[r[R_C]] ??= []).push(v); }
  const avgs = Object.entries(by).map(([c, v]) => ({ c: Number(c), avg: Math.round((v.reduce((a, b) => a + b, 0) / v.length) * 100) / 100, n: v.length }));
  avgs.sort((a, b) => b.avg - a.avg || a.c - b.c);
  let place = 0, last = null;
  avgs.forEach((x, i) => { if (x.avg !== last) { place = i + 1; last = x.avg; } x.place = place; });
  return avgs;
}
const fmtAvg = (v) => v.toFixed(2).replace(".", ",");
const MEDAL = { 1: "g", 2: "s", 3: "b" };
function classBadges(stats, classes, myCls, pastK) {
  return stats.map((x) => {
    const mine = x.c === myCls, moved = mine && pastK ? pastK - x.place : 0;
    return `<span class="cb ${mine ? "mine" : ""}" title="${esc(classes[x.c] || "")}: ${fmtAvg(x.avg)}">${esc(classes[x.c] || "?")}${mine ? "<small>Вы</small>" : ""}
      ${MEDAL[x.place] ? `<span class="md ${MEDAL[x.place]}">${x.place}</span>` : ""}${moved ? `<span class="mv ${moved > 0 ? "up" : "down"}">${moved > 0 ? "+" : ""}${moved}</span>` : ""}</span>`;
  }).join("");
}
function classesView() {
  const r = ratingData(), classes = r?.classes || [], me = myRow(r?.board || []);
  if (!me) return `<div class="scr-card">Чтобы сравнить классы, нужен список параллели. Он появится после следующего обновления.</div>`;
  const myCls = me[R_C], week = histAgo(7);
  const all = classStats(r.board), mineAll = all.find((x) => x.c === myCls);
  let h = `<div class="scr-card"><div class="scr-card-h"><b>Ваш класс ${esc(classes[myCls] || "")}</b><span class="r">${mineAll ? `${mineAll.place}-е место из ${all.length}` : ""}</span></div>
    <button class="crow" data-open-cls=""><span class="cn">Общий</span><span class="cls">${classBadges(all, classes, myCls, week?.k)}</span><span class="chv">›</span></button>
    <div class="note-calc">Средний балл класса: ${mineAll ? fmtAvg(mineAll.avg) : "—"}. Места классов посчитаны по средним баллам учеников из рейтинга Дневник.ру.</div></div>
    <h2 class="scr-h">По предметам</h2><div class="scr-card">`;
  const subs = (r.subjects || []).filter((x) => (x.board || []).length);
  h += subs.map((x) => {
    const st = classStats(x.board), b = myRow(x.board);
    const past = week?.s?.[x.name]?.[2];
    return `<button class="crow" data-open-cls="${esc(x.name)}"><span class="cn">${esc(x.name)}</span><span class="cls">${classBadges(st, classes, b ? b[R_C] : myCls, past)}</span><span class="chv">›</span></button>`;
  }).join("") || `<div class="scr-note">Списков по предметам пока нет.</div>`;
  return h + `</div>`;
}
function clsScreen(sc) {
  const r = ratingData(), classes = r?.classes || [], sub = sc.name ? ratingFor(sc.name) : null;
  const board = (sub ? sub.board : r?.board) || [], me = myRow(board), myCls = me ? me[R_C] : -1;
  const st = classStats(board), mine = st.find((x) => x.c === myCls);
  const podium = (items, av) => {
    const order = [items[1], items[0], items[2]];
    return `<div class="podium">${order.map((x, i) => x ? `<div class="p${[2, 1, 3][i]}">${av(x)}<small>${esc(x.label)}</small><div class="step">${[2, 1, 3][i]}</div></div>` : "<div></div>").join("")}</div>`;
  };
  let h = scrTop(sub ? sub.name : "Общий рейтинг классов", mine ? `Сегодня ваш класс на ${mine.place}-м месте` : "");
  h += `<div class="scr-card"><div class="scr-card-h"><b>Места классов</b><span class="r">по среднему баллу</span></div>
    ${podium(st.slice(0, 3).map((x) => ({ ...x, label: `${classes[x.c] || "?"} · ${fmtAvg(x.avg)}` })), (x) => `<div class="pav ${x.c === myCls ? "own" : ""}" style="font-size:16px;font-weight:800;color:#1b2a7a">${esc(classes[x.c] || "?")}</div>`)}
    ${st.length > 3 ? `<div class="note-calc">${st.slice(3).map((x) => `${x.place}. ${esc(classes[x.c] || "?")} · ${fmtAvg(x.avg)}`).join(" · ")}</div>` : ""}</div>`;
  if (me) {
    const mates = board.filter((x) => x[R_C] === myCls).sort((a, b) => (a[R_K] || 999) - (b[R_K] || 999));
    const ava = (x) => `<div class="pav ${x[R_ME] ? "own" : ""}">${x[R_ME] ? esc((data?.student?.name || "Я").slice(0, 1)) : avatarOf(x[R_A])}</div>`;
    h += `<div class="scr-card"><div class="scr-card-h"><b>Топ учеников ${esc(classes[myCls] || "")}</b></div>${podium(mates.slice(0, 3).map((x) => Object.assign([...x], { label: x[R_M] })), ava)}</div>`;
    const ups = mates.filter((x) => x[R_D] && !downChange(x[R_D])).sort((a, b) => markNum(b[R_D]) - markNum(a[R_D])).slice(0, 3);
    if (ups.length) h += `<div class="scr-card"><div class="scr-card-h"><b>Топ изменений ср. балла</b></div>${ups.map((x) => boardRow(x, "class", myCls, classes)).join("")}</div>`;
    h += `<div class="scr-card"><div class="scr-card-h"><b>Ваш средний балл</b><span class="r">${me[R_D] ? `<span class="dl ${downChange(me[R_D]) ? "neg" : "pos"} solid">${esc(fmtChange(me[R_D]))}</span>` : "без изменений"}</span></div>
      ${boardRow(me, "class", myCls, classes)}</div>`;
  }
  h += `<div class="note-calc" style="text-align:center">Места классов посчитаны программой по средним баллам учеников. В приложении Дневник.ру цифры могут немного отличаться.</div>`;
  return { html: h, theme: "blue" };
}

// ---------- экраны поверх страницы: «Ваш рейтинг», списки, предмет, урок. Кнопка «назад» браузера и телефона закрывает верхний ----------
let screens = [];
function openScreen(sc) {
  const fromMark = !!markKey;
  markKey = null; showMarkModal();
  screens.push(sc);
  try { (fromMark && history.state?.m ? history.replaceState : history.pushState).call(history, { scr: screens.length }, ""); } catch {}
  renderScreen("push");
}
function backScreen() {
  if (!screens.length) return;
  try { history.back(); } catch { popScreens(screens.length - 1); }
}
function popScreens(depth) {
  if (screens.length <= depth) return;
  const el = $("#screen");
  if (el.innerHTML) {                                                       // уходящий экран уезжает вправо, под ним уже новый
    const g = el.cloneNode(true); g.removeAttribute("id"); g.classList.remove("push"); g.classList.add("scr-ghost");
    document.body.appendChild(g); g.scrollTop = el.scrollTop;
    setTimeout(() => g.remove(), 300);
  }
  while (screens.length > depth) screens.pop();
  renderScreen();
}
try { if (history.state?.scr || history.state?.m) history.replaceState({}, ""); } catch {}
window.addEventListener("popstate", () => {
  const st = history.state || {};
  if (markKey && !st.m) { markKey = null; showMarkModal(); }               // «назад» на телефоне закрывает карточку оценки
  popScreens(st.scr || 0);
});
const scrTop = (title, sub = "") => `<div class="scr-top"><button class="scr-back" data-scr-back aria-label="Назад">‹</button><div class="scr-title"><h1>${esc(title)}</h1>${sub ? `<small>${esc(sub)}</small>` : ""}</div></div>`;
function renderScreen(anim = "") {
  const el = $("#screen"), sc = screens[screens.length - 1];
  document.body.classList.toggle("has-screen", !!sc);
  if (!sc || !data) { el.innerHTML = ""; el.className = ""; delete el.dataset.sig; return; }
  const top = el.scrollTop, same = el.dataset.sig === JSON.stringify(sc);
  const parts = { rating: ratingScreen, board: boardScreen, subject: subjectScreen, lesson: lessonScreen, cls: clsScreen }[sc.t](sc);
  el.className = `scr scr-${sc.t} ${parts.theme || ""} ${anim}`;
  el.innerHTML = parts.html;
  el.dataset.sig = JSON.stringify(sc);
  el.scrollTop = same ? top : 0;
  if (anim === "push" && !same) countUp(el);
}

function ratingScreen(sc) {
  const r = ratingData(), classes = r?.classes || [], board = r?.board || [], me = myRow(board);
  const view = sc.view === "cls" ? "cls" : "me";
  let h = scrTop("Ваш рейтинг", r?.period || "") + seg([["me", "Личный"], ["cls", "Классы"]], view, "data-rview");
  if (view === "cls") return { html: h + classesView(), theme: "blue" };
  h += ratingPlaques(true);
  h += sparkChart();
  const mini = (mode) => boardRows(around(listFor(board, mode)), mode, me?.[R_C], classes, listFor(board, mode));
  if (board.length && me) {
    h += `<h2 class="scr-h">Рейтинг общий</h2><div class="scr-card"><div class="scr-card-h"><b>Место в классе</b><button class="lnk" data-open-board="" data-bmode="class">Открыть все</button></div>${mini("class")}</div>
      <div class="scr-card"><div class="scr-card-h"><b>Место в параллели</b><button class="lnk" data-open-board="" data-bmode="all">Открыть все</button></div>${mini("all")}</div>`;
  }
  const subs = [...(r?.subjects || [])].filter((x) => x.place).sort((a, b) => a.place - b.place);
  if (subs.length) {
    h += `<h2 class="scr-h">Рейтинг по предметам</h2><p class="scr-note">На основе данных о среднем балле учащихся в параллели${r.period ? ` (${esc(r.period)})` : ""}</p>
      <div class="scr-card"><div class="scr-card-h"><b>Ваши места по предметам</b></div>${subs.map(subjectRow).join("")}</div>`;
  }

function subjectRow(x) {
  return `<button class="srow" data-open-board="${esc(x.name)}" data-bmode="all"><span class="dw"><span class="dia sm s">${x.place}</span>${x.place === 1 ? `<i class="crown">👑</i>` : ""}</span>
    <span class="sn">${esc(x.name)}</span><span class="sv">${esc(x.mark || "")}</span>
    ${x.change ? `<span class="dl ${downChange(x.change) ? "neg" : "pos"} solid">${esc(fmtChange(x.change))}</span>` : ""}<span class="chv">›</span></button>`;
}
function boardScreen(sc) {
  const r = ratingData(), sub = sc.name ? ratingFor(sc.name) : null, classes = r?.classes || [];
  const board = (sub ? sub.board : r?.board) || [], me = myRow(board), rows = listFor(board, sc.mode);

    <div class="b-cols"><span>Место в ${sc.mode === "class" ? "классе" : "параллели"}</span><span>Ср. балл</span><button class="tgl" data-bmode-toggle>${esc(toggle)}</button></div>
    <div class="b-list">${boardRows(rows, sc.mode, me?.[R_C], classes) || `<div class="scr-note">Списка пока нет.</div>`}</div>` };
